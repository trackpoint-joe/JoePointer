/* ------------------------------------------------------------------ phone
   David's spec, 2026-09-24. Two corners become one strip, three controls
   become one row, and the activity panel becomes a sheet. Everything here is
   inside the media query: the desktop layout above is untouched.

   Marcus's correction, kept in the CSS as well as the JS: the badge says the
   state in full. "DEMO, SPED UP" may wrap to two short lines, and it may never
   be clipped to "DEMO". A viewer who cannot see that the pace is not real is
   being told something untrue.

   Overlap is avoided by construction rather than by luck: the strip is a fixed
   52px band at the top, the bar is a fixed 56px band at the bottom, the scrub
   sits between them, and the sheet covers the bottom 60vh above the bar. No
   phone rule uses an arbitrary offset that another rule could grow into. */
#mobileBar, #provenance { display: none; }

/* The breakpoint is two conditions, not one. A 375x812 phone turned sideways
   is 812px wide, so a max-width rule alone hands it the desktop layout on a
   375px tall screen. Height catches the rotation that width misses. Found by
   the test at 812x375 on 2026-09-24, and worth telling David: the spec's
   landscape rule nested inside max-width 600 could never have matched. */
@media (max-width: 600px), (max-height: 480px) and (orientation: landscape) {
  :root { --panel-w: 100vw; }

  /* One strip across the top: gear and the title on the left, state badge on
     the right. The two desktop corners stop existing. */
  #gear {
    top: 10px;
    left: 10px;
    width: 32px;
    height: 32px;
    font-size: 16px;
    z-index: 6;
  }
  body.banner-up #gear, body.banner-up #drawer { top: 10px; }

  #caption.header {
    top: 14px;
    left: 52px;
    right: 128px;
    max-width: none;
    z-index: 5;
  }
  #caption.header.compact { gap: 8px; }
  #caption.header.compact .hTitle { font-size: 15px; }
  #caption.header.compact .hSub, #caption.header.compact .hBody { display: none; }
  #caption.header.compact .hLink { display: none; }
  /* Expanded, it drops inline below the strip rather than covering the scene. */
  #caption.header:not(.compact) {
    top: 52px;
    left: 10px;
    right: 10px;
    padding: 12px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--panel);
  }
  #caption.header:not(.compact) .hTitle { font-size: 19px; }
  #caption.header:not(.compact) .hBody { font-size: 13px; }

  /* The badge. Two short lines are fine, clipping is not. */
  #marker {
    top: 10px;
    right: 10px;
    min-width: 0;
    max-width: 118px;
    padding: 6px 8px;
    border-radius: 8px;
    z-index: 6;
  }
  body.panel-open #marker { right: 10px; }
  #markerLabel {
    font-size: 10px;
    letter-spacing: .06em;
    gap: 5px;
    white-space: normal;
    line-height: 1.15;
  }
  #markerClock { font-size: 17px; line-height: 1.1; }
  #markerNow, #markerWhere { display: none; }

  /* Provenance, on a tap, directly under the badge. */
  #provenance {
    display: block;
    position: fixed;
    top: 62px;
    right: 10px;
    max-width: 72vw;
    padding: 9px 11px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: var(--panel);
    color: var(--muted);
    font-size: 12px;
    line-height: 1.45;
    z-index: 7;
  }
  #provenance.hidden { display: none; }

  /* One row along the bottom. Icons, nothing else. */
  #mobileBar {
    display: flex;
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    height: 56px;
    align-items: center;
    justify-content: space-around;
    gap: 8px;
    padding: 0 12px;
    border-top: 1px solid var(--border);
    background: var(--panel);
    z-index: 6;
  }
  #mobileBar button {
    flex: 1 1 0;
    height: 40px;
    border: 1px solid var(--border);
    border-radius: 9px;
    background: none;
    color: var(--muted);
    font-size: 16px;
    cursor: pointer;
  }
  #mobileBar button.on { color: var(--accent); border-color: var(--accent); }
  #mTray { font-family: var(--mono); font-size: 13px; }
  /* A count of zero is an empty box by another name. Joe flagged the empty
     tray on desktop; on a phone the button goes too, and the other two widen. */
  #mTray.empty { display: none; }

  /* The desktop versions of those three are gone on a phone. */
  #music, #panelTab, #tray { display: none; }
  /* Except the music picker, when the bar's music icon asks for it and there
     is more than one track to choose from. Above the bar, right side. */
  #music.show:not(.hidden) { display: flex; right: 10px; bottom: 66px; z-index: 7; }

  /* The scrubber sits between the two bands, never under either. */
  #scrub { left: 12px; right: 12px; bottom: 64px; }
  body.panel-open #scrub { right: 12px; }

  /* The activity panel becomes a bottom sheet, above the bar. */
  #panel {
    top: auto;
    left: 0;
    right: 0;
    bottom: 56px;
    width: 100vw;
    height: 60vh;
    border-left: 0;
    border-top: 1px solid var(--border);
    border-radius: 14px 14px 0 0;
    transform: translateY(calc(100% + 56px));
    transition: transform .28s ease;
    z-index: 5;
  }
  body.panel-open #panel { transform: none; }
  #panelHead { padding: 14px; }
  /* A grip, so it reads as something that can be pushed back down. */
  #panelHead::before {
    content: "";
    position: absolute;
    top: 6px;
    left: 50%;
    width: 36px;
    height: 3px;
    margin-left: -18px;
    border-radius: 2px;
    background: var(--border);
  }

  /* The settings drawer covers most of the width, but not all of it: the edge
     that is left is how you get out of it without hunting for the button. */
  #drawer { width: 86vw; }

  /* Anything that assumed a mouse. */
  #scrubHelp { display: none; }
}

/* Landscape on a phone. The sheet would leave nothing to look at, so it takes
   the right half instead, and the top strip gets shorter. */
@media (max-height: 480px) and (orientation: landscape) {
  #panel {
    top: 0;
    bottom: 0;
    left: auto;
    right: 0;
    width: 62vw;
    height: 100vh;
    border-radius: 0;
    border-left: 1px solid var(--border);
    border-top: 0;
    transform: translateX(102%);
  }
  body.panel-open #panel { transform: none; }
  #panelHead::before { display: none; }
  #mobileBar { height: 46px; }
  #mobileBar button { height: 34px; }
  #scrub { bottom: 54px; }
  #caption.header:not(.compact) { max-height: 46vh; overflow-y: auto; }
}

/* Demo intro, David 2026-09-25. Title and a tap, a flight to the brain, the
   paragraph centred over it, then the paragraph shrinks into the header. The
   rest of the page stays out of sight until the header has landed. */
#intro { position: fixed; inset: 0; z-index: 20; cursor: pointer; }
#intro .iTitleCard, #intro .iCard {
  position: absolute; left: 50%; top: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
}
#intro .iTitleCard { width: min(90vw, 900px); transition: opacity .4s ease-in, transform .4s ease-in; }
#intro .iTitle {
  font-size: 64px; font-weight: 700; line-height: 1.1; color: #e8edf5;
  animation: introLift .6s ease-out both;
}
#intro .iSub {
  margin-top: 12px; font-size: 20px; font-weight: 500; color: #8d99ad;
  animation: introLift .6s ease-out .15s both;
}
#intro .iGo {
  margin-top: 28px; padding: 10px 26px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--panel);
  color: var(--muted); font: inherit; font-size: 15px; cursor: pointer;
  animation: introLift .6s ease-out .4s both;
}
#intro .iGo:hover, #intro .iGo:focus-visible { color: var(--accent); border-color: var(--accent); outline: none; }
@keyframes introLift { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: none; } }

#intro .iCard {
  width: min(88vw, 60ch); padding: 28px 32px; border-radius: 14px;
  background: rgba(5, 7, 13, .7);
  border: 1px solid rgba(143, 166, 204, .14);
  opacity: 0; pointer-events: none;
  transition: opacity .6s ease-out;
}
#intro .iBody { margin: 0; font-size: 22px; line-height: 1.6; color: #c9d2e0; text-align: left; }
#intro .iMark { font-weight: 600; }
#intro .iCardTitle { font-size: 30px; font-weight: 700; line-height: 1.15; color: #e8edf5; text-align: left; }
#intro .iRule.iCardRule { margin: 12px 0 18px; width: 140px; animation: none; }
#intro .iRule {
  width: 180px; height: 3px; margin: 16px auto 0; border-radius: 2px; opacity: .85;
  animation: introLift .6s ease-out .08s both;
}
#intro .iHint { margin-top: 18px; font-size: 13px; color: var(--faint); letter-spacing: .04em; }

#intro.flight .iTitleCard, #intro.read .iTitleCard, #intro.settle .iTitleCard {
  opacity: 0; transform: translate(-50%, calc(-50% - 30px)); pointer-events: none;
}
#intro.read .iCard, #intro.settle .iCard { opacity: 1; }
/* The settle transition is written inline, so the shrink and the fade share one clock. */
#intro.settle { pointer-events: none; }

body.intro #gear, body.intro #drawer, body.intro #caption, body.intro #marker,
body.intro #music, body.intro #tray, body.intro #panel, body.intro #panelTab,
body.intro #mobileBar, body.intro #provenance, body.intro #scrub {
  opacity: 0 !important; pointer-events: none !important;
}
body.intro-out #gear, body.intro-out #caption, body.intro-out #marker,
body.intro-out #music, body.intro-out #tray, body.intro-out #panel, body.intro-out #panelTab,
body.intro-out #mobileBar, body.intro-out #provenance, body.intro-out #scrub {
  transition: opacity .8s ease;
}

@media (max-width: 600px), (max-height: 480px) and (orientation: landscape) {
  #intro .iTitle { font-size: 36px; }
  #intro .iSub { font-size: 16px; }
  #intro .iCard { width: 88vw; padding: 18px 18px; }
  #intro .iBody { font-size: 17px; }
  #intro .iCardTitle { font-size: 22px; }
  #intro .iRule.iCardRule { margin: 10px 0 14px; width: 110px; }
}
@media (max-height: 480px) and (orientation: landscape) {
  #intro .iBody { font-size: 14px; line-height: 1.45; }
}
@media (prefers-reduced-motion: reduce) {
  #intro .iTitle, #intro .iSub, #intro .iGo { animation: none; }
}

<body>

<!-- The scene. Everything three dimensional is drawn here by js/brain3d.js
     with a hand rolled projection onto a canvas 2D context. -->
<canvas id="stage"></canvas>

<!-- Overlays stay HTML. They are flat by nature and text in the DOM stays
     selectable, legible and crisp at any device pixel ratio. -->

<div id="banner" class="hidden"></div>

<!-- Settings. Gear top left, drawer slides in from the left, because the
     activity panel owns the right. Joe, 2026-09-24: the instructions that used
     to sit along the bottom live in here now, under Controls. -->
<button id="gear" type="button" title="Settings and controls (s)" aria-label="Settings and controls">
  <span aria-hidden="true">&#9881;</span>
</button>

<aside id="drawer" aria-label="Settings" hidden>
  <div id="drawerHead">
    <span>Settings</span>
    <button id="drawerClose" type="button" title="Close (s)">Close</button>
  </div>
  <div id="drawerBody"></div>
  <div id="drawerFoot">
    <button id="drawerReset" type="button">Reset everything to defaults</button>
  </div>
</aside>

<!-- Demo header, top left beside the gear, demo mode only, and only on a pack
     recorded from a real session. Words in js/data.js BRAIN_LABELS.demoHeader. -->
<div id="caption" class="hidden"></div>

<!-- REPLAY and LIVE must never be mistakable for each other across a room, so
     they differ in wording, in colour and in whether the dot beats. -->
<div id="marker">
  <div id="markerLabel"><span id="markerDot"></span><span id="markerText">REPLAY</span></div>
  <div id="markerClock">--:--:--</div>
  <div id="markerNow">NOW --:--:--</div>
  <div id="markerWhere"></div>
</div>

<!-- Music. Joe's own tracks from music/, or from the folder beside an export
     built with --with-music. Hidden entirely when there are none. Never plays
     by itself: browsers block sound before a gesture, and a screensaver that
     starts making noise on its own would be wrong even if they did not. -->
<div id="music" class="hidden">
  <button id="musicMute" type="button" title="Mute (m)" aria-label="Mute">
    <span id="musicGlyph">&#9835;</span>
  </button>
  <select id="musicPick" aria-label="Music">
    <option value="">Off</option>
  </select>
</div>

<!-- Non-seat agents are deliberately not in the 3D scene. At some orbit angle
     a floating chip would drift near the file shell and read as a seat, so
     they live here, flat, behind a dashed border, per the 3D spec. -->
<div id="tray" class="empty">
  <div id="trayHead">Other agents</div>
  <div id="trayChips"></div>
</div>

<!-- The activity log. Every event of the session so far, newest first, in a
     side panel Joe can hide with the tab or the a key. Replaces the three line
     ticker that used to sit along the bottom. -->
<aside id="panel" aria-label="Activity">
  <div id="panelHead">
    <span id="panelTitle">Activity</span>
    <span id="panelCount"></span>
    <button id="panelClose" type="button" title="Hide (a)">Hide</button>
  </div>
  <ol id="panelList"></ol>
</aside>
<button id="panelTab" type="button" title="Show activity (a)">Activity</button>

<!-- Phone controls. Hidden above 600px; the media query is the only thing
     that shows them, so a desktop never pays for them and a phone never has
     to wait for script to build them. -->
<div id="mobileBar">
  <button id="mMusic" type="button" aria-label="Music">&#9835;</button>
  <button id="mPanel" type="button" aria-label="Activity">&#9776;</button>
  <button id="mTray" type="button" aria-label="Other agents"><span id="mTrayCount">0</span></button>
</div>

<div id="provenance" class="hidden"></div>

<div id="scrub">
  <div id="scrubTrack">
    <div id="scrubFill"></div>
    <div id="scrubHead"></div>
  </div>
</div>

<script type="application/json" id="brain-labels">{"version":1,"files":{"expert-bench.md":{"label":"The bench","public":"The bench"},"team-charter.md":{"label":"Team charter","public":"Team charter"},"open-items.md":{"label":"Open items ledger","public":"Open items ledger"},"BRIEF.md":{"label":"Project brief","public":"Project brief"},"MEMORY.md":{"label":"Memory index","public":"Memory index","append":"project"},"CLAUDE.md":{"label":"Project rules","public":"Project rules","global_label":"Global rules","global_public":"Global rules"}}}</script>
<script>
// The data layer. Fetches the bench and the log, picks the session to replay,
// and answers "what was true at time t". It draws nothing.
//
// The renderer is being specified in parallel and will sit on top of this
// without changing it. What it calls:
//
//   await Brain.load()        fetches everything, picks the replay session
//   Brain.source              "log" or "fixture", drives the banner
//   Brain.bench               23 seats: slug, name, section, model, gate
//   Brain.seat(slug)          one seat record, or null
//   Brain.events              the replay session, sorted by parsed ts
//   Brain.start / Brain.end   epoch milliseconds, the scrubber range
//   Brain.at(t)               state at epoch millisecond t
//   Brain.words(event)        one event in plain words
//   Brain.clock(ts)           local wall clock for an event
//
// Brain.at(t) returns:
//   { t, awake, edges, seatsAwake, seen, last }
//   awake  one entry per subagent started at or before t and not yet stopped,
//          each with its last tool and path
//   edges  every read or write inside the last EDGE_WINDOW_MS, actor to file
//
// Deliberately a linear scan per call rather than an index. A session is
// hundreds of events, a scrub frame is sixty a second, and an index would be a
// second structure to keep true. If a session ever runs to tens of thousands
// of events this is the thing to revisit, and nothing else changes.

/**
 * Strings that are somebody's call rather than the code's.
 *
 * joeRole and demoCaption are open, pending Joe. They live here, in the data
 * layer, because both the words the ticker builds and the labels the renderer
 * draws need them, and two copies would drift. brain3d.js reads them from
 * here; there is nothing to change in CONFIG.
 *
 * demoCaption is empty on purpose. Give it a line and it appears top left in
 * demo mode, in the page and in the exported file. Nothing else appears there.
 */
const BRAIN_LABELS = {
  // Joe ruled 2026-09-24. Cass dissented on the role and Joe kept it.
  joeRole: 'Human in the Lead',
  // Joe ruled 2026-09-24, AI-Joe's wording, verbatim. It is only shown when
  // the pack it is describing is a recording of a real session, because the
  // line says so. See demoCaptionRequiresOrigin.
  // Revised 2026-09-24: web and connector events pulse too. Marcus refused the
  // old line as false; AI-Joe passed this one; Joe approved.
  demoCaption: 'The AI experts I direct, replaying one real session. A seat pulses only when it actually read or wrote a file, went to the web, or used a connector.',
  // The demo header, 2026-09-24. Drafted by Claude, claims checked by Marcus,
  // property by Cass, voice by AI-Joe, layout by David; Joe chose "The" and
  // left Cass's ownership sentence out. Shown only on a pack whose origin is
  // log, like the caption it replaces, because it says "a real session".
  // The track that plays under the demo intro, matched by title. Tessa's
  // working title, 2026-09-25; change it here if Joe names the file otherwise.
  // Absent from the library, the intro runs silent.
  introTrack: 'Quiet, Then Arriving',
  demoHeader: {
    title: 'The Expert Project Team',
    subhead: 'One real working session, replayed',
    body: 'I run my work through a standing team of AI agents, each one an expert seat with a defined role and its own rules. Two gates sit on what goes out in my name. Marcus attacks the claims. AI-Joe checks that it sounds like me. Leaving either one off is a decision I have to state. Then I make the call. This is a real session from September 2026. I directed Claude and eight of those agents to build the view you are watching. A seat pulses only when it actually read or wrote a file, went to the web, or used a connector.',
    linkText: 'joepointer.com',
    linkHref: 'https://joepointer.com',
  },
  // The caption claims "one real session". A generated pack is not one, so the
  // line stays off the screen until meta.origin says log. Marcus, 2026-09-24.
  demoCaptionRequiresOrigin: 'log',
  notOnTeam: 'other agent',       // Joe, 2026-09-24. Was "not on the team" (AI-Joe), which undersold helpers working for a seat
  handoff: 'returned to Joe',     // the label on the gold edge, Marcus
};

const Brain = {
  LABELS: BRAIN_LABELS,
  source: null,
  sourceDir: null,
  bench: [],
  sections: [],
  benchWarnings: null,
  sessions: [],
  session: null,
  events: [],
  dropped: null,
  start: 0,
  end: 0,
  EDGE_WINDOW_MS: 8000,
  _seats: new Map(),

  /**
   * Friendly file labels. Yusuf's rules, 2026-09-24, first match wins.
   *
   *   1 method    an explicit entry in js/labels.json
   *   2 memory    the path runs through a memory directory
   *   3 code      .py .js .mjs .ts .ps1
   *   4 page      .html .css
   *   5 document  everything else, the basename
   *
   * Method beats memory on purpose: a team charter lives inside a memory
   * directory and is still the charter. The file is never opened, only its
   * path is read, which is the whole reason this is safe to run on a log.
   *
   * A basename missing from labels.json falls through to the patterns and
   * still gets a label. Nothing goes dark for want of an entry.
   */
  labels: { files: {} },
  servers: { names: {}, fallback: 'a connector' },

  async loadLabels() {
    const tag = typeof document !== 'undefined' && document.getElementById('brain-labels');
    if (tag && tag.textContent.trim()) {
      try {
        this.labels = JSON.parse(tag.textContent);
        return this.labels;
      } catch (err) {
        // fall through to the fetch, and past that to the patterns
      }
    }
    try {
      this.labels = await fetchJson('js/labels.json');
    } catch (err) {
      this.labels = { files: {} };
    }
    // Connector display names. Local only: a demo pack never names a server,
    // so an export ships without this and the fallback covers every case.
    const stag = typeof document !== 'undefined' && document.getElementById('brain-servers');
    if (stag && stag.textContent.trim()) {
      try { this.servers = JSON.parse(stag.textContent); } catch (err) { /* fallback */ }
    } else {
      try { this.servers = await fetchJson('js/servers.json'); } catch (err) { /* fallback */ }
    }
    return this.labels;
  },

  /**
   * The kind of a file, from its path alone.
   *
   * Kinds carry their memory subtype, because a scrubbed demo pack has no path
   * left to read and the renderer still has to tell a feedback note from a
   * project note. make_demo.py computes this from the real path before the
   * scrub and writes it onto the event.
   */
  fileKind(path) {
    if (!path) return 'document';
    const p = String(path);
    const base = p.split('/').pop();
    const entry = (this.labels.files || {})[base];
    if (entry) {
      return (entry.global_path && p === entry.global_path) ? 'method-global' : 'method';
    }
    if (p.indexOf('/memory/') !== -1) {
      const m = /^(feedback|project|reference|user)-/.exec(base);
      return m ? 'memory:' + m[1] : 'memory:other';
    }
    if (/[.](py|js|mjs|ts|ps1)$/i.test(base)) return 'code';
    if (/[.](html|css)$/i.test(base)) return 'page';
    return 'document';
  },

  /**
   * Work that happened outside this machine, in plain words.
   *
   * The log holds a tool and at most a target. It never holds a query, a
   * command, a URL path or a connector argument, so these are the only
   * sentences that can be built, which is the point rather than a limitation.
   *
   * On a demo nothing is named at all: a site is a site and a connector is a
   * connector, because the pack itself carries no domain and no server name.
   */
  outsideWords(e) {
    const isPublic = this.source === 'demo';
    if (e.tool === 'WebSearch') return 'searched the web';
    if (e.tool === 'WebFetch') {
      const site = e.target && e.target !== 'a site' && !isPublic ? e.target : 'a site';
      return 'fetched ' + site;
    }
    if (e.tool === 'mcp') return 'used ' + this.serverName(e.target);
    if (e.tool === 'Bash' || e.tool === 'PowerShell') return 'ran a command';
    if (e.tool === 'Grep' || e.tool === 'Glob') return 'searched files';
    return null;
  },

  /** A connector's display name, or the fallback when it is unknown or opaque. */
  serverName(target) {
    if (this.source === 'demo') return this.servers.fallback || 'a connector';
    const key = String(target || '').toLowerCase();
    const named = (this.servers.names || {})[key];
    if (named) return named;
    // An opaque id is worse than no name: it reads as a leak and means nothing.
    const opaque = !key || key.length > 18 || /^[0-9a-f-]{16,}$/.test(key);
    return opaque ? (this.servers.fallback || 'a connector') : key;
  },

  /**
   * The family a tool belongs to, for the one sentence a failure gets.
   *
   * A failure says which kind of call did not work and never which call. The
   * families are coarse on purpose: "a shell call failed" tells Joe where to
   * look without the log holding what he was running.
   */
  toolFamily(tool) {
    if (tool === 'Read' || tool === 'Write' || tool === 'Edit') return 'file';
    if (tool === 'WebFetch' || tool === 'WebSearch') return 'web';
    if (tool === 'Bash' || tool === 'PowerShell') return 'shell';
    if (tool === 'Grep' || tool === 'Glob') return 'search';
    if (tool === 'mcp') return 'connector';
    return 'tool';
  },

  /**
   * Could this agent have started another one?
   *
   * No hook field names a parent, so parentage is inferred, and the inference
   * is only safe because of one fact checked on disk 2026-09-24: every one of
   * the 23 bench agents has an explicit tools line and not one of them lists
   * Agent or Task. A bench seat cannot start anything, so when only seats are
   * awake the parent of a new seat is the session's main thread.
   *
   * Anything that is not a bench seat is treated as able to spawn, including
   * agents this machine has never seen. Guessing wrong in that direction draws
   * no line; guessing wrong the other way draws a line that is a lie.
   *
   * Claude's judgment, not a documented field.
   */
  couldSpawn(entry) {
    return !(entry && entry.seat);
  },

  /** m:ss under an hour, h:mm above. Bea: elapsed only, never a total. */
  elapsed(ms) {
    const secs = Math.max(0, Math.floor(ms / 1000));
    if (secs < 3600) return Math.floor(secs / 60) + ':' + String(secs % 60).padStart(2, '0');
    return Math.floor(secs / 3600) + 'h' + String(Math.floor((secs % 3600) / 60)).padStart(2, '0');
  },

  /** The same span in words, for the line a seat gets when it returns. */
  elapsedWords(ms) {
    const secs = Math.max(0, Math.round(ms / 1000));
    if (secs < 60) return secs + 's';
    const m = Math.floor(secs / 60);
    if (m < 60) return m + 'm ' + String(secs % 60).padStart(2, '0') + 's';
    return Math.floor(m / 60) + 'h ' + String(m % 60).padStart(2, '0') + 'm';
  },

  /** True when this event is Joe being waited on rather than work happening. */
  isWait(e) {
    return e.event === 'PermissionRequest'
      || (e.event === 'Notification' && (e.target === 'decision' || e.target === 'turn'));
  },

  /** A wait that is only Joe's turn, not a decision put to him. */
  isTurnWait(e) {
    return e.event === 'Notification' && e.target === 'turn';
  },

  /** Tools that say a seat is busy and nothing else. No pulse, no edge. */
  isQuietTool(tool) {
    return tool === 'Bash' || tool === 'PowerShell' || tool === 'Grep' || tool === 'Glob';
  },

  /** Tools that reach outside this machine and get a node on the outer shell. */
  isOutsideTool(tool) {
    return tool === 'WebSearch' || tool === 'WebFetch' || tool === 'mcp';
  },

  /** True for Yusuf's memory kind only. A charter, a ledger or a brief is method. */
  isMemoryKind(kind) {
    return String(kind || '').indexOf('memory:') === 0;
  },

  /**
   * The words on the node and in the panel row.
   *
   * opts.kind      precomputed, for a pack whose paths are already scrubbed
   * opts.project   the project slug, for the memory index
   * opts.isPublic  the demo, where Cass generalises every memory file
   */
  fileLabel(path, opts) {
    const o = opts || {};
    const base = String(path || '').split('/').pop();
    const kind = o.kind || this.fileKind(path);
    const files = this.labels.files || {};

    if (kind === 'method' || kind === 'method-global') {
      const entry = files[base];
      if (!entry) return base;   // an entry can vanish; the basename still reads
      const global = kind === 'method-global';
      let label = o.isPublic
        ? (global ? entry.global_public || entry.public : entry.public) || entry.label
        : (global ? entry.global_label || entry.label : entry.label);
      if (entry.append === 'project' && o.project) label += ': ' + o.project;
      return label;
    }

    if (this.isMemoryKind(kind)) {
      const sub = kind.slice('memory:'.length);
      // Cass, 2026-09-24. On a demo the topic is the part that identifies the
      // work, so it comes off entirely. A viewer sees that a note was read,
      // never which one.
      if (o.isPublic) return sub === 'feedback' ? 'Feedback note' : 'Project note';
      const topic = base
        .replace(/[.][^.]+$/, '')
        .replace(/^(feedback|project|reference|user)-/, '')
        .replace(/-+/g, ' ')
        .trim();
      const head = { feedback: 'Feedback', project: 'Project note', reference: 'Reference', user: 'User note' }[sub] || 'Memory';
      return head + ': ' + topic;
    }

    if (kind === 'code') return 'Code: ' + base;
    if (kind === 'page') return 'Page: ' + base;
    return base;
  },

  /** The label for one event, which is what both the scene and the panel use. */
  labelForEvent(e) {
    return this.fileLabel(e.path, {
      kind: e.kind,
      project: e.project,
      isPublic: this.source === 'demo',
    });
  },

  /**
   * The demo pack, if this page is a demo.
   *
   * Two ways it arrives. A self contained export carries it in a JSON script
   * tag, which is the only form that works from file:// with no server. The
   * /demo route on the loopback server fetches demo/session.json instead.
   * Either way the pack is the whole truth for the page: bench, events and the
   * provenance line. No /api call is made in demo mode, ever, which is what
   * makes the exported file work with the network switched off.
   */
  embeddedPack() {
    const tag = typeof document !== 'undefined' && document.getElementById('brain-pack');
    if (!tag || !tag.textContent.trim()) return null;
    try {
      return JSON.parse(tag.textContent);
    } catch (err) {
      return null;
    }
  },

  isDemoUrl() {
    return typeof location !== 'undefined' && /(^|\/)demo\/?$/.test(location.pathname);
  },

  /**
   * A v1 line has no target and a v2 line does. One shape reaches the
   * renderer either way: a missing target is null, never undefined, so no
   * drawing code has to know which version it is looking at.
   */
  normalise(events) {
    for (const e of events || []) {
      if (e.target === undefined) e.target = null;
      if (e.kind === undefined) e.kind = this.fileKind(e.path);
    }
    return events || [];
  },

  /** Adopt a pack as the whole state. Same shape the routes produce. */
  usePack(pack) {
    this.source = 'demo';
    this.meta = pack.meta || {};
    this.bench = pack.bench || [];
    this.sections = [...new Set(this.bench.map((x) => x.section))];
    this.benchWarnings = null;
    this._seats = new Map(this.bench.map((x) => [x.slug, x]));
    this.events = this.normalise(pack.events || []);
    this.dropped = null;
    this.sessions = [];
    const first = this.events[0];
    const last = this.events[this.events.length - 1];
    this.session = first ? {
      session_id: first.session_id,
      project: first.project,
      first_ts: first.ts,
      last_ts: last.ts,
      first_ts_ms: first.ts_ms,
      last_ts_ms: last.ts_ms,
      event_count: this.events.length,
      seat_count: new Set(this.events.filter((e) => e.seat_slug).map((e) => e.seat_slug)).size,
      replay_eligible: true,
    } : null;
    this.start = first ? first.ts_ms : 0;
    this.end = last ? last.ts_ms : 0;
    return this;
  },

  async load(sessionId) {
    await this.loadLabels();
    const embedded = this.embeddedPack();
    if (embedded) return this.usePack(embedded);
    if (this.isDemoUrl()) return this.usePack(await fetchJson('demo/session.json'));

    const bench = await fetchJson('/api/bench');
    this.source = bench.source;
    this.bench = bench.seats;
    this.sections = bench.sections;
    this.benchWarnings =
      bench.missingFromBench.length || bench.unknownToAgents.length
        ? { missing: bench.missingFromBench, unknown: bench.unknownToAgents }
        : null;
    this._seats = new Map(this.bench.map((s) => [s.slug, s]));

    const list = await fetchJson('/api/sessions');
    this.sessions = list.sessions;
    this.dropped = list.dropped;
    this.files = list.files;
    this.sourceDir = list.brain_dir;

    // Yusuf's rule, applied by the server: the replay session is the one that
    // owns the most recent SubagentStop. A session where no subagent ran is
    // not offered. The page may override with an explicit id.
    const id = sessionId || list.replay_session_id;
    if (!id) {
      this.session = null;
      this.events = [];
      this.start = this.end = 0;
      return this;
    }
    const detail = await fetchJson('/api/session/' + encodeURIComponent(id));
    this.session = detail.session;
    this.events = this.normalise(detail.events);
    this.start = this.session.first_ts_ms;
    this.end = this.session.last_ts_ms;
    return this;
  },

  /**
   * The live feed. All fetching stays in the data layer, including this.
   *
   * tail() with no cursor asks the server where today's file ends right now
   * and returns no events, which is how the page starts watching without
   * replaying the part of the day it missed. tail(cursor) returns everything
   * appended since, already annotated by the server with ts_ms, seat and
   * seat_slug, exactly like session events. The cursor is opaque here on
   * purpose: the page passes back whatever it was handed.
   */
  async tail(cursor) {
    const res = await fetchJson('/api/tail' + (cursor ? '?cursor=' + encodeURIComponent(cursor) : ''));
    this.normalise(res.events);
    return res;
  },

  /**
   * Today's whole file, for seeding. A seat that woke before the page opened
   * and has not returned is awake, and the only record of that is earlier in
   * today's file, so live mode reads it once on the way in.
   */
  async tailFromDayStart() {
    const res = await fetchJson('/api/tail?from=day');
    this.normalise(res.events);
    return res;
  },

  /**
   * Who is awake at the end of a list of events, pairing on agent_id.
   *
   * Same shape as at().awake so the renderer treats a seeded live state and a
   * replay state identically. A Start with no Stop is awake; that is the only
   * thing that makes a seat awake, in replay or live.
   */
  awakeFrom(events) {
    const awake = new Map();
    for (const e of events) {
      const key = e.agent_id;
      if (!key) continue;
      if (e.event === 'SubagentStart') {
        awake.set(key, {
          agent_id: key,
          agent: e.agent,
          seat: e.seat,
          slug: e.seat_slug,
          name: e.seat_slug ? (this.seat(e.seat_slug) || {}).name || e.agent : e.agent,
          since_ms: e.ts_ms,
          session_id: e.session_id,
          project: e.project,
          owner: e.owner_project_name || null,
          last: null,
        });
      } else if (e.event === 'SubagentStop') {
        awake.delete(key);
      } else if (e.event === 'PostToolUse') {
        const live = awake.get(key);
        if (live) live.last = { tool: e.tool, path: e.path, ts_ms: e.ts_ms };
      }
    }
    return [...awake.values()];
  },

  /**
   * Human in the Lead. Joe is not a subagent and has no agent_type, so his
   * events are recognised by kind: a message he sent, or a decision the
   * session put to him and he answered. Nothing else lights his node.
   */
  isJoe(e) {
    if (e.agent_id) return false;
    if (e.event === 'UserPromptSubmit') return true;
    return e.event === 'PostToolUse' && (e.tool === 'AskUserQuestion' || e.tool === 'ExitPlanMode');
  },

  seat(slug) {
    return this._seats.get(slug) || null;
  },

  /**
   * How an agent is named on screen.
   *
   * A project that ships its own agent of a bench name gets said out loud:
   * "ai-joe (CareerPointers)". Three projects on this machine carry their own
   * ai-joe.md, and without the project beside it a viewer would read that as
   * the bench's voice gate. The server decides ownership, this only says it.
   */
  agentName(agent, owner) {
    return owner ? agent + ' (' + owner + ')' : String(agent);
  },

  /** Who the event belongs to, as the renderer needs to group it. */
  actorOf(e) {
    if (e.seat_slug) return e.seat_slug;
    if (e.agent) return e.agent;
    return 'main';
  },

  at(t) {
    const awake = new Map();
    const edges = [];
    let seen = 0;
    let last = null;

    for (const e of this.events) {
      if (e.ts_ms > t) break;
      seen += 1;
      last = e;

      const key = e.agent_id || null;
      if (e.event === 'SubagentStart' && key) {
        awake.set(key, {
          agent_id: key,
          agent: e.agent,
          seat: e.seat,
          slug: e.seat_slug,
          name: e.seat_slug ? (this.seat(e.seat_slug) || {}).name || e.agent : e.agent,
          since_ms: e.ts_ms,
          owner: e.owner_project_name || null,
          last: null,
        });
      } else if (e.event === 'SubagentStop' && key) {
        awake.delete(key);
      } else if (e.event === 'PostToolUse') {
        const live = key ? awake.get(key) : null;
        if (live) live.last = { tool: e.tool, path: e.path, ts_ms: e.ts_ms };
        if (e.path && t - e.ts_ms <= this.EDGE_WINDOW_MS) {
          edges.push({
            actor: this.actorOf(e),
            seat: e.seat,
            slug: e.seat_slug,
            agent: e.agent,
            tool: e.tool,
            path: e.path,
            ts_ms: e.ts_ms,
            age_ms: t - e.ts_ms,
          });
        }
      }
    }

    const list = [...awake.values()];
    return {
      t,
      awake: list,
      seatsAwake: list.filter((a) => a.seat).map((a) => a.slug),
      edges,
      seen,
      last,
    };
  },

  /**
   * One event in plain words.
   *
   * A seat is named by its slug, the way Joe refers to the team. Anything else
   * is named as itself and marked, because an Explore agent is real work that
   * happened and must show up without being painted onto a seat.
   *
   * full: true keeps the whole home-relative path. The ticker is the one place
   * the full path is allowed to appear, per section 1 of the layout spec; the
   * ring labels use the short form.
   */
  words(e, full) {
    if (Brain.isJoe(e)) {
      const role = BRAIN_LABELS.joeRole;
      return e.event === 'UserPromptSubmit' ? 'Joe, ' + role + ', spoke' : 'Joe, ' + role + ', made a call';
    }
    const who = e.seat_slug
      ? e.seat_slug
      : e.agent
        ? this.agentName(e.agent, e.owner_project_name) + ', ' + BRAIN_LABELS.notOnTeam + ','
        : 'the main session';
    if (e.event === 'SubagentStart') return who + ' woke';
    if (e.event === 'SubagentStop') return who + ' returned';
    if (e.event === 'PermissionRequest') return who + ' is waiting on Joe for a decision';
    if (e.event === 'Notification') {
      return e.target === 'turn' ? 'Claude is waiting on Joe'
        : who + ' is waiting on Joe for a decision';
    }
    if (e.event === 'PermissionDenied') return who + ': blocked by auto mode';
    if (e.event === 'PostToolUseFailure') {
      return who + ': a ' + this.toolFamily(e.tool) + ' call failed';
    }
    const outside = this.outsideWords(e);
    if (outside) return who + ' ' + outside;
    const verb = { Read: 'read', Write: 'wrote', Edit: 'edited' }[e.tool] || String(e.tool).toLowerCase();
    return who + ' ' + verb + ' ' + (full ? e.path : shortLabel(e.path));
  },

  clock(ts) {
    const d = new Date(ts);
    // 12-hour with AM or PM by default, the way Joe's taskbar clock reads
    // (Joe, 2026-09-25). The drawer can switch it to 24-hour.
    const pad = (n) => String(n).padStart(2, '0');
    const h = d.getHours();
    if (this.clock24) return pad(h) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    return (h % 12 || 12) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds())
      + (h < 12 ? ' AM' : ' PM');
  },
};

/**
 * The part of a path worth reading at a glance.
 *
 * Basename, with the parent folder kept when it carries meaning.
 * A file sitting directly in a dot directory reads as its name alone. A file
 * one level down keeps that one folder, so a memory file keeps its memory
 * prefix and a hook keeps its hooks prefix. Everything above that is dropped.
 * The full value is still on the element as a title, so nothing is hidden,
 * only shortened.
 */
function shortLabel(path) {
  if (!path) return '';
  const parts = String(path).replace(/^~\//, '').split('/');
  const file = parts.pop();
  const parent = parts.pop();
  if (!parent || parent.startsWith('.')) return file;
  return parent + '/' + file;
}

async function fetchJson(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(url + ' returned ' + res.status);
  return res.json();
}

window.Brain = Brain;

</script>
<script>
// The settings drawer.
//
// Every preference here applies live, persists per browser in localStorage,
// and resets to the CONFIG value it came from. Nothing in here can hide the
// REPLAY, LIVE or DEMO marker, the SPED UP label or the FIXTURE banner: those
// say what the viewer is looking at, and a screensaver that lets you turn off
// the label saying it is a recording is a screensaver that lies.
//
// Layout is David's, 2026-09-24. Gear top left, drawer from the left, because
// the activity panel owns the right. The music transport stays bottom right
// and only its set-once preferences live in here.
//
// Demo mode and the exported file show rotation and Controls, nothing else.
// A stranger gets the one control that makes the thing watchable and the list
// of keys, and none of the machine's own settings.

const Settings = {
  values: {},
  defaults: {},
  editToken: '',
  config: null,       // what the server says about edit mode, the allowlist and the log
  built: false,

  /** Read once, at startup, before anything is drawn. */
  init(CONFIG, PALETTE) {
    this.CONFIG = CONFIG;
    this.defaults = {
      rotation: CONFIG.autoRotateSecPerTurn,   // 0 means off
      drift: CONFIG.floatAmp,
      ambient: CONFIG.ambient,
      roleMode: 'near',
      timers: CONFIG.showTimers,
      parentage: CONFIG.showParentage,
      labelScale: 1,
      maxGap: CONFIG.demoMaxGapMs,
      panelOpen: CONFIG.panelOpenDefault,
      clock24: false,
      playMode: 'one',
      quietHours: false,
      quietFrom: '22:00',
      quietTo: '07:00',
      playlist: [],
    };
    this.values = { ...this.defaults, ...this.load() };
    this.apply();
    return this;
  },

  load() {
    try {
      return JSON.parse(localStorage.getItem('brain.settings') || '{}');
    } catch (err) {
      return {};
    }
  },

  save() {
    try {
      localStorage.setItem('brain.settings', JSON.stringify(this.values));
    } catch (err) { /* a browser with storage off still works, it just forgets */ }
  },

  set(key, value) {
    this.values[key] = value;
    this.save();
    this.apply();
    this.build();
  },

  reset() {
    this.values = { ...this.defaults };
    this.save();
    this.apply();
    this.build();
  },

  /** Push the values into CONFIG. The renderer reads CONFIG every frame. */
  apply() {
    const C = this.CONFIG;
    const v = this.values;
    C.autoRotate = v.rotation > 0;
    if (v.rotation > 0) C.autoRotateSecPerTurn = v.rotation;
    C.floatAmp = v.drift;
    C.ambient = v.ambient;
    C.showTimers = v.timers;
    C.showParentage = v.parentage;
    C.showRoles = v.roleMode !== 'never';
    C.roleAlways = v.roleMode === 'always';
    C.labelScale = v.labelScale;
    C.demoMaxGapMs = v.maxGap;
    C.panelOpenDefault = v.panelOpen;
    C.clock24 = v.clock24;
    Brain.clock24 = v.clock24;
  },

  // ------------------------------------------------------------- the drawer

  open(yes) {
    const on = yes === undefined ? !document.body.classList.contains('drawer-open') : yes;
    document.body.classList.toggle('drawer-open', on);
    if (on) this.build();
  },

  el(tag, cls, text) {
    const n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text;
    return n;
  },

  group(title) {
    const g = this.el('div', 'sgroup');
    g.appendChild(this.el('h3', '', title));
    return g;
  },

  /** A row of mutually exclusive buttons. A native radio in a dark drawer
   *  looks like a form; this reads as a setting. */
  choice(group, label, key, options) {
    const row = this.el('div', 'srow');
    row.appendChild(this.el('span', 'lab', label));
    const box = this.el('div', 'schoice');
    for (const [text, value] of options) {
      const b = this.el('button', this.values[key] === value ? 'on' : '', text);
      b.type = 'button';
      b.addEventListener('click', () => this.set(key, value));
      box.appendChild(b);
    }
    row.appendChild(box);
    group.appendChild(row);
  },

  toggle(group, label, key) {
    this.choice(group, label, key, [['On', true], ['Off', false]]);
  },

  note(group, text) {
    group.appendChild(this.el('p', 'snote', text));
  },

  build() {
    const body = document.getElementById('drawerBody');
    if (!body) return;
    body.textContent = '';
    const demo = Brain.source === 'demo';

    const motion = this.group('Motion');
    this.choice(motion, 'Rotation', 'rotation',
      [['Off', 0], ['Slow', 150], ['Normal', 90], ['Fast', 60]]);
    if (!demo) {
      this.choice(motion, 'Drift', 'drift',
        [['Off', 0], ['Subtle', this.defaults.drift / 2], ['Normal', this.defaults.drift]]);
      this.toggle(motion, 'Ambient', 'ambient');
      this.toggle(motion, 'Show who started whom', 'parentage');
    }
    body.appendChild(motion);

    // The demo's opening plays once per visit. This brings it back.
    if (demo && window.Brain3D && window.Brain3D.introAvailable) {
      const intro = this.group('Intro');
      const row = this.el('div', 'srow');
      row.appendChild(this.el('span', 'lab', 'Opening'));
      const box = this.el('div', 'schoice');
      const b = this.el('button', '', 'Play again');
      b.type = 'button';
      b.addEventListener('click', () => { this.open(false); window.Brain3D.replayIntro(); });
      box.appendChild(b);
      row.appendChild(box);
      intro.appendChild(row);
      body.appendChild(intro);
    }

    if (!demo) {
      const labels = this.group('Labels');
      this.choice(labels, 'Roles', 'roleMode',
        [['Near only', 'near'], ['Always', 'always'], ['Never', 'never']]);
      this.choice(labels, 'Label size', 'labelScale',
        [['Small', 0.85], ['Medium', 1], ['Large', 1.25]]);
      this.toggle(labels, 'Show work timers', 'timers');
      this.choice(labels, 'Clock', 'clock24',
        [['12-hour', false], ['24-hour', true]]);
      body.appendChild(labels);

      const pace = this.group('Replay pace');
      this.choice(pace, 'Longest wait', 'maxGap',
        [['0.9s', 900], ['2s', 2000], ['5s', 5000]]);
      this.note(pace, 'How long the replay ever waits between two events. The clock still '
        + 'shows each event at its real time.');
      body.appendChild(pace);

      const panel = this.group('Activity panel');
      this.toggle(panel, 'Starts open', 'panelOpen');
      body.appendChild(panel);

      body.appendChild(this.musicGroup());
      body.appendChild(this.websitesGroup());
    }

    // Controls, in every mode including the demo and the export. Strangers
    // need this most, and it is the reason the bar along the bottom went.
    const keys = this.group('Controls');
    const grid = this.el('div', 'scontrols');
    for (const [k, what] of [
      ['drag', 'orbit the brain'],
      ['wheel', 'zoom'],
      ['double click', 'reset the view'],
      ['space', 'pause'],
      ['click the bar', 'seek'],
      ['a', 'activity panel'],
      ['s', 'settings'],
      ['m', 'mute'],
      ...(document.body.classList.contains('demo') ? [['i', 'about this demo']] : []),
    ]) {
      grid.appendChild(this.el('b', '', k));
      grid.appendChild(this.el('span', '', what));
    }
    keys.appendChild(grid);
    body.appendChild(keys);
    this.built = true;
  },

  // --------------------------------------------------------------- music

  musicGroup() {
    const g = this.group('Music');
    this.choice(g, 'Play mode', 'playMode',
      [['Repeat one', 'one'], ['All in order', 'all'], ['Shuffle', 'shuffle']]);
    this.toggle(g, 'Quiet hours', 'quietHours');

    const row = this.el('div', 'srow');
    row.appendChild(this.el('span', 'lab', 'Silent between'));
    const box = this.el('div', 'schoice');
    for (const key of ['quietFrom', 'quietTo']) {
      const input = document.createElement('input');
      input.type = 'time';
      input.className = 'sinput stime';
      input.value = this.values[key];
      input.addEventListener('change', () => this.set(key, input.value));
      box.appendChild(input);
    }
    row.appendChild(box);
    g.appendChild(row);
    this.note(g, 'Quiet hours can silence the music or move past a track. It never starts '
      + 'sound on its own: a browser needs a click first, and so does this.');

    // The playlist, dragged into the order Joe wants.
    const list = this.el('ul', 'slist');
    const order = this.playlist();
    order.forEach((track, i) => {
      const li = this.el('li', 'drag');
      li.draggable = true;
      li.appendChild(this.el('span', '', (i + 1) + '. ' + track.title));
      li.addEventListener('dragstart', (ev) => {
        li.classList.add('dragging');
        ev.dataTransfer.setData('text/plain', String(i));
      });
      li.addEventListener('dragend', () => li.classList.remove('dragging'));
      li.addEventListener('dragover', (ev) => ev.preventDefault());
      li.addEventListener('drop', (ev) => {
        ev.preventDefault();
        const from = Number(ev.dataTransfer.getData('text/plain'));
        if (Number.isNaN(from) || from === i) return;
        const files = order.map((t) => t.file);
        const [moved] = files.splice(from, 1);
        files.splice(i, 0, moved);
        this.set('playlist', files);
      });
      list.appendChild(li);
    });
    if (order.length) g.appendChild(list);
    else this.note(g, 'No tracks yet. Drop MP3 files into the music folder.');
    return g;
  },

  /** Tracks in the saved order, with anything new appended. */
  playlist() {
    const tracks = (window.Brain3D && window.Brain3D.music.tracks) || [];
    const saved = this.values.playlist || [];
    const byFile = new Map(tracks.map((t) => [t.file, t]));
    const out = [];
    for (const file of saved) if (byFile.has(file)) { out.push(byFile.get(file)); byFile.delete(file); }
    for (const t of byFile.values()) out.push(t);
    return out;
  },

  inQuietHours(now) {
    if (!this.values.quietHours) return false;
    const mins = (s) => {
      const [h, m] = String(s || '').split(':').map(Number);
      return (h || 0) * 60 + (m || 0);
    };
    const t = now.getHours() * 60 + now.getMinutes();
    const from = mins(this.values.quietFrom);
    const to = mins(this.values.quietTo);
    // A window that crosses midnight is two windows.
    return from <= to ? (t >= from && t < to) : (t >= from || t < to);
  },

  // ------------------------------------------------------------ websites

  websitesGroup() {
    const g = this.group('Approved websites');
    const cfg = this.config || {};
    const allow = cfg.allowlist || [];

    const list = this.el('ul', 'slist');
    for (const domain of allow) {
      const li = this.el('li');
      li.appendChild(this.el('span', '', domain));
      if (cfg.allowEdit) {
        const x = this.el('button', '', '×');
        x.type = 'button';
        x.title = 'Remove ' + domain;
        x.addEventListener('click', () => this.removeDomain(domain));
        li.appendChild(x);
      }
      list.appendChild(li);
    }
    g.appendChild(list);

    if (!cfg.allowEdit) {
      this.note(g, 'A visit to one of these is recorded by name. Everything else is recorded '
        + 'as "a site". Start with the edit shortcut to change this.');
      return g;
    }

    const input = document.createElement('input');
    input.className = 'sinput';
    input.placeholder = 'add a domain, for example sec.gov';
    input.addEventListener('keydown', (ev) => {
      if (ev.key === 'Enter') { this.addDomain(input.value); input.value = ''; }
    });
    g.appendChild(input);
    this.note(g, 'Removing a site applies from now on. Lines already in the log keep the '
      + 'name they were written with.');

    if ((cfg.changes || []).length) {
      const log = this.el('div', 'schanges');
      for (const c of cfg.changes) {
        log.appendChild(this.el('div', '', (c.when || '').replace('T', ' ').slice(0, 19)
          + '  ' + c.action + '  ' + c.detail));
      }
      g.appendChild(this.el('h3', '', 'Changes'));
      g.appendChild(log);
    }

    if ((cfg.days || []).length) {
      g.appendChild(this.el('h3', '', 'Delete a day of log'));
      const days = this.el('ul', 'slist');
      for (const day of cfg.days) {
        const li = this.el('li');
        li.appendChild(this.el('span', '', day));
        const x = this.el('button', '', '×');
        x.type = 'button';
        x.title = 'Delete ' + day;
        x.addEventListener('click', () => this.deleteDay(day));
        li.appendChild(x);
        days.appendChild(li);
      }
      g.appendChild(days);
    }
    return g;
  },

  async post(path, body) {
    const res = await fetch(path, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...body, token: this.editToken }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) {
      window.alert('Refused: ' + (data.error || res.status)
        + (data.refused ? '\\n' + data.refused.join(', ') : ''));
      return null;
    }
    return data;
  },

  async addDomain(raw) {
    const domain = String(raw || '').trim();
    if (!domain) return;
    // The confirmation says what changes, in the words Helen wrote.
    if (!window.confirm('Visits to ' + domain.toLowerCase()
      + ' will be recorded by name from now on.')) return;
    const next = [...(this.config.allowlist || []), domain];
    const data = await this.post('/api/allowlist', { domains: next });
    if (data) { this.config.allowlist = data.allowlist; this.config.changes = data.changes || this.config.changes; this.build(); }
  },

  async removeDomain(domain) {
    if (!window.confirm('Stop recording ' + domain + ' by name? Lines already written keep it.')) return;
    const next = (this.config.allowlist || []).filter((d) => d !== domain);
    const data = await this.post('/api/allowlist', { domains: next });
    if (data) { this.config.allowlist = data.allowlist; this.config.changes = data.changes || this.config.changes; this.build(); }
  },

  async deleteDay(day) {
    if (!window.confirm('Delete events-' + day + '.jsonl? Everything recorded that day goes, '
      + 'and it cannot be undone.')) return;
    const data = await this.post('/api/log/delete', { day });
    if (data) { this.config.days = data.days; this.config.changes = data.changes || this.config.changes; this.build(); }
  },

  /** Ask the server what it will allow. Skipped entirely in demo mode. */
  async loadConfig() {
    const meta = document.querySelector('meta[name="brain-edit"]');
    this.editToken = (meta && meta.content) || '';
    if (Brain.source === 'demo') { this.config = { allowEdit: false, allowlist: [] }; return; }
    try {
      this.config = await (await fetch('/api/config', { cache: 'no-store' })).json();
    } catch (err) {
      this.config = { allowEdit: false, allowlist: [] };
    }
  },

  wire() {
    const gear = document.getElementById('gear');
    const close = document.getElementById('drawerClose');
    const reset = document.getElementById('drawerReset');
    if (gear) gear.addEventListener('click', () => this.open());
    if (close) close.addEventListener('click', () => this.open(false));
    if (reset) {
      reset.addEventListener('click', () => {
        if (window.confirm('Put every setting back to its default?')) this.reset();
      });
    }
    window.addEventListener('keydown', (ev) => {
      if (ev.key === 's' && !/^(INPUT|TEXTAREA|SELECT)$/.test((ev.target || {}).tagName || '')) {
        this.open();
      }
      if (ev.key === 'Escape') this.open(false);
    });
  },
};

window.Settings = Settings;

</script>
<script>
// The 3D renderer. Canvas 2D context with a hand rolled perspective
// projection. No WebGL, no library, no CDN, no build step.
//
// Why canvas 2D is the right tool and not a compromise: the scene is 23 seats,
// at most 14 file nodes and a few transient edges, so under fifty projected
// points a frame. What would force WebGL is fill rate over thousands of
// sprites, and there are tens. Every gradient is pre-rendered once into a
// sprite and blitted after that, which is the only part that would otherwise
// cost real time at this scale.
//
// It is a view over Brain.at(t) and nothing else, exactly as the SVG renderer
// was. No state about what happened lives here. js/data.js stays the single
// source of truth. The 2D SVG renderer it replaced was deleted 2026-09-24.
//
// Geometry, colour and camera come from David Park's design/3d-spec.md, which
// supersedes section 1 of design/layout-spec.md. Node states, the transient
// edge rule and the three cuts still come from the 2D spec, unchanged.
//
// The bench has five sections and four of them hold seats. Gates is the fifth
// and it does not sit on the arrangement: AI-Joe and Marcus are the hub at the
// centre. Anywhere this file says sections it means the four seat sections.

// ---------------------------------------------------------------- CONFIG
// Every tunable. Change a number here, reload, nothing else to read.
const CONFIG = {
  // Replay, carried over from the 2D renderer.
  pulseMs: 700,
  writeDotMs: 700,
  edgeMs: 700,
  breatheMs: 5000,
  breatheMin: 0.85,
  breatheMax: 1.0,
  gapCapMs: 2000,
  silenceSpeed: 4,
  playbackSpeed: 1,
  endHoldMs: 1500,        // freeze fully lit at the end of the replay
  crossfadeMs: 1200,      // then cross fade back to frame one, never a cut

  // Demo pacing, Joe 2026-09-24: a viewer never waits. Every real gap between
  // two events is shown in this window, however long it really was. The clock
  // still shows each event's real time and the marker says SPED UP.
  demoPacing: true,
  demoMinGapMs: 220,      // a burst still reads as separate beats
  demoMaxGapMs: 900,      // nothing waits longer than this

  // Ambient motion, Joe 2026-09-24: the brain is always alive. None of it ever
  // looks like an event. It never uses the pulse colour, never travels along a
  // seat to file path, and never speeds up with activity (Bea's rule).
  ambient: true,
  floatAmp: 0.018,        // scene units each node drifts from its home
  floatPeriodMinMs: 7000,
  floatPeriodMaxMs: 13000,
  idleBreathDepth: 0.10,  // every halo breathes this much, out of phase; kept under awake's 0.15 (David)
  idleBreathMs: 6500,
  webAlpha: 0.10,         // faint lines between seats of the same section
  webNeighbours: 2,
  webShimmerMs: 9000,
  dustCount: 160,
  dustAlpha: 0.32,
  dustSizePx: 1.6,
  dustSpeed: 0.000035,    // scene units per ms
  dustShellR: 1.55,
  logMax: 400,            // activity panel keeps this many events, newest first
  panelOpenDefault: true, // first visit only; after that the last choice is remembered
  panelShiftEase: 0.14,
  // Demo intro, David 2026-09-25: title, a tap (the tap is what lets a browser
  // play sound), a flight in from deep space, the paragraph, then the header.
  // Once per visit. Timings are David's judgment, not tested on viewers.
  introFlightMs: 5500,
  introFromDistance: 60,
  introStarCount: 500,
  introNebulae: 8,
  introStarFadeMs: 1500,
  introReadMs: 22000,       // the paragraph moves on by itself after this
  introAutoBeginMs: 10000,  // a viewer who never taps still gets the flight, silent
  introSettleMs: 700,
  introLabelFromK: 0.7,     // labels fade in over the last 30% of the flight
  introCrossfadeMs: 2500,   // intro music into the demo track
  // Where the first hit lands in "Quiet, Then Arriving", measured from the
  // file's loudness on 2026-09-25 (near silence, a rise, a jump at 4.0 s).
  // With music playing the flight lasts exactly this long, so the brain
  // arrives on the hit. A silent flight keeps introFlightMs.
  introHitSec: 4.0,
  headerHoldMs: 22000,     // David: about one relaxed read of the paragraph (judgment, outside seat)
  headerNarrowPx: 900,     // below this width the demo header stays compact   // how quickly the scene recentres when the panel slides
  memoryCap: 14,
  fadeMs: 500,
  nowTickMs: 500,

  // Camera. Spec section 4.
  focal: 900,
  distance: 3.0,
  distanceMin: 1.8,
  distanceMax: 5.0,
  elevationDeg: 18,
  yawStart: 0.0,
  pitchClampDeg: 80,
  autoRotateSecPerTurn: 90,    // one full turn every ninety seconds, constant
  autoRotateResumeMs: 3000,    // quiet time after a drag before it picks up
  autoRotateEaseMs: 500,       // eased back in rather than snapped
  resetTweenMs: 800,           // double click tween back to the default camera
  dragYawPerPx: 0.0075,
  dragPitchPerPx: 0.0055,
  inertiaDamping: 0.93,        // per 16ms frame
  inertiaCutoff: 0.00035,
  wheelPerNotch: 0.0016,

  // Depth multipliers, near to far. Spec section 3.
  depthSizeNear: 1.0,
  depthSizeFar: 0.4,
  depthGlowNear: 1.0,
  depthGlowFar: 0.5,
  depthLabelNear: 1.0,
  depthLabelFar: 0.15,
  depthEdgeNear: 1.0,
  depthEdgeFar: 0.4,

  // Node sizes in scene units. Screen size falls out of the projection, so
  // zooming in makes a node bigger the way it should.
  seatWorldR: 0.055,
  gateWorldR: 0.075,
  coreWorldR: 0.042,
  fileWorldR: 0.030,
  labelWorldSize: 0.075,
  fileLabelWorldSize: 0.048,
  labelMinPx: 9,
  labelMaxPx: 34,
  labelOffsetR: 2.2,           // label sits this many node radii below centre

  // Role line under each seat name, read from the bench table's Seat column.
  showRoles: true,
  roleScale: 0.62,             // role text size as a fraction of the name size
  roleMinPx: 8,
  roleAlpha: 0.72,             // role is quieter than the name
  roleDepthPower: 2,           // roles fade faster with depth than names do
  roleNearK: 0.35,             // roles show only on nodes nearer than this depth, or on hover (David, Joe chose a)
  labelStaggerPx: 12,          // every other seat in a section drops its label this far (David)

  haloScale: 3.6,              // sprite width in node radii
  haloIdle: 0.30,
  haloTouched: 0.55,
  haloAwake: 1.0,
  bodyIdle: 0.42,
  bodyTouched: 0.72,
  bodyAwake: 1.0,
  pulseGrowR: 3.4,             // expanding glow reaches this many node radii
  writeDotR: 0.9,              // filled dot radius in node radii
  edgeSamples: 20,
  edgeHeadFraction: 0.3,
  edgeWidthPx: 1.5,
  edgeArc: 0.12,               // gentle lift so an edge is not a dead straight line
  hoverSlopPx: 18,             // pointer distance that counts as hovering a node

  // Human in the Lead. Joe sits above the team; the call reaches him after
  // AI-Joe returns. The handoff edge lingers longer than a file edge because
  // it is the one moment the whole method turns on.
  // The memory round trip. Joe asked for "a loop there and back to show it is
  // collecting info and bringing it back". Every number below is David's,
  // judgment, outside seat. Memory means Yusuf's memory kind only: a path
  // through a memory directory. The bench, the ledger, the charter, the rules
  // and the brief are method, and they behave like any other file.
  memoryEventMs: 1000,        // total life of a memory read, out and back
  memoryOutMs: 450,           // outbound leg, thin, no payload
  memoryReturnMs: 550,        // return leg, twice the width, carries the bead
  memoryWriteMs: 450,         // a memory write is one way and ends at the file
  memoryLoopSpread: 0.06,     // bow off the chord, as a fraction of its length
  memoryOutAlpha: 0.5,
  memoryReturnAlpha: 0.85,
  memoryReturnWidthMul: 2,
  memoryBeadR: 2.2,           // bead radius, in edgeWidthPx
  memoryRingGap: 0.62,        // inner ring of the double ring, share of the outer
  fileLabelMaxChars: 22,      // David: truncate, then an ellipsis

  // Work outside this machine. A web fetch, a search, a connector. David's
  // layout, Bea's rules: one Web node and at most six app nodes, on a shell
  // outside the files, and nothing on screen counts anything.
  // Wireframe solids. Joe, 2026-09-24: a flat hexagon among spheres reads as a
  // sticker on a window. These are real vertices in world space, projected
  // through the same camera every frame, so they turn with the orbit and carry
  // their own depth. Never filled: filled would compete with the seats.
  // Phones. David's spec, 2026-09-24. A phone is not a small desktop: the
  // scene is further away so the ring fits, labels stop growing, and a tap
  // does what a hover did.
  phoneMaxPx: 600,
  phoneShortPx: 480,      // a landscape phone is short, not narrow
  phoneDistance: 3.0,     // was 3.4; the zoom now scales with the screen instead
  focalRefPx: 1080,       // the short side CONFIG.focal was tuned on
  focalMinK: 0.3,
  focalMaxK: 1.3,
  phoneLabelMaxPx: 22,
  // Measured 2026-09-24 on the fixture under a 4x slowdown, steady state:
  // 160 motes cost avg 0.57ms, p99 2.26ms, worst 8.84ms a frame, and 80 motes
  // saved 0.04ms of that. Dust is not what costs on a phone, so it stays at
  // 160 and this stays off. Flip it and the count drops on phones only.
  phoneDustBudget: false,
  phoneDustCount: 80,
  pinchMinPx: 8,             // ignore a two finger jitter smaller than this
  doubleTapMs: 320,
  tapSlopPx: 12,             // a tap that moves more than this was a drag

  solidSpinSecPerTurn: 24,   // constant, never tied to how much is happening
  solidFarDim: 0.45,         // the far edges of one solid, against its near ones
  globeLongitudes: 6,
  globeLatitudes: 3,
  globeSamples: 16,
  globeScale: 1.3,           // radius, as a multiple of the hexagon it replaces
  cubeScale: 1.6,            // EDGE length, in node radii, not the radius
  ringTiltDeg: 30,

  webWorldR: 0.045,
  appWorldR: 0.045,
  appCap: 6,                  // most recent six, the seventh evicts the oldest
  webEdgeMs: 900,             // straight radial edge, one way, then gone
  webPulseThrottleMs: 2000,   // at most one outside pulse per seat in this window
  workingHoldMs: 4000,        // a quiet tool holds the seat looking busy this long

  // Waiting on Joe. A wait is a state, not an event: it starts, it holds, and
  // it ends when the session moves again. Nothing about it accumulates.
  // Who started whom. Quieter than Joe's gold, because a seat starting is
  // ordinary and Joe being waited on is not.
  showParentage: true,
  startLinkMs: 1200,        // core to seat, travelling head, at the start
  returnLinkMs: 600,        // seat to core, shorter, at the return
  threadAlpha: 0.10,        // the held thread while a seat is awake
  // Time per seat. Bea: elapsed while awake, elapsed on return, and nothing
  // that adds up. No totals, no ranking, no per seat counter anywhere.
  showTimers: true,
  timerScale: 0.62,         // timer text size, as a fraction of the name

  waitMaxMs: 600000,        // a wait this old is stale, not waiting
  waitRingMs: 1600,         // Joe's ring cycle while a decision is pending
  waitLineAlpha: 0.35,      // the held line, no travelling head, just held
  // A failure dips the actor twice and leaves nothing behind. No new hue.
  dipMs: 140,
  dipTo: 0.35,
  dipCount: 2,

  joeWorldR: 0.085,
  handoffMs: 1800,
  // Marcus, 2026-09-24. The handoff edge used to draw whenever AI-Joe had
  // returned at any point since Joe last spoke, which over a long session
  // meant an hour could pass and the screen would still claim a handoff. It
  // now needs Joe's event to be the next one after the gate returned, with no
  // other seat in between, inside this window.
  handoffWindowMs: 300000,
  // The two strings that are still Joe's call, joeRole and demoCaption, live
  // in js/data.js as BRAIN_LABELS. One place, read by both files.

  // Live mode. The page polls the tail of today's log and switches itself.
  livePollMs: 1000,            // how often the tail is asked for new lines
  liveIdleMs: 90000,           // quiet this long and it falls back to replay
  liveBurstCap: 40,            // a bigger catch up batch lands without animating

  // Music. Joe picks a track from the selector; nothing ever starts by itself.
  musicVolume: 0.6,
  musicFadeMs: 400,

  // Set by the settings drawer, which is the only thing that changes them.
  autoRotate: true,
  roleAlways: false,
  labelScale: 1,

  maxDpr: 2,
  showStats: false,            // press f for the frame time readout
};

// --------------------------------------------------------------- PALETTE
// David Park, design/3d-spec.md section 2. Four hues at roughly 30, 198, 262
// and 340 degrees, deliberately avoiding the 60 to 160 band. Read and write
// share one accent and differ by glyph, never by hue.
//
// The HTML overlays read these same values through CSS custom properties
// written at startup, so the chrome and the scene can never drift apart.
const PALETTE = {
  bg: '#05070d',
  sections: {
    // Keyed by the section's first word, so the public demo's "Career" and the
    // bench's full name get the same colour. Joe renamed it for public 2026-09-24.
    'Career': '#4ea8ff',
    'Content, story, and visibility': '#c084fc',
    'Build': '#ff9d4d',
    'Business and practice': '#ff6fa5',
  },
  sectionOrder: ['#4ea8ff', '#c084fc', '#ff9d4d', '#ff6fa5'],
  gates: { 'ai-joe': '#ffe9c7', marcus: '#cfe3ff' },
  joe: '#ffd27a',          // Human in the Lead. Judgment, pending David.
  handoff: '#ffd27a',
  // The failure dot in the panel. Muted coral, used for one dot and nothing
  // else: a failure is information, not an alarm.
  failure: '#e8836f',
  core: '#ffffff',
  file: '#7a8699',
  // Outside activity. One hue at rest, one brighter for the moment it happens.
  outside: '#c98fd6',
  outsideEvent: '#e0a0ee',
  edge: '#bfe9ff',
  pulse: '#bfe9ff',
  memoryEvent: '#8f9bff',   // David, 2026-09-24. Memory events only.
  label: '#e8edf5',
  labelOutline: '#05070d',
  // Overlay chrome, derived from the same family.
  panel: 'rgba(8, 11, 20, 0.82)',
  border: '#1b2331',
  muted: '#8d99ad',
  dust: '#8fa6cc',
  faint: '#5d687c',
  accent: '#bfe9ff',
};

// ---------------------------------------------------------------- LAYOUT
// Spec section 1. Section centres on a sphere by golden angle, seats scattered
// on a small local sphere around each centre, files on an outer shell. A flat
// ring was rejected because edge on it collapses four clusters into one line.
const LAYOUT = {
  clusterR: 0.75,        // radius of the four section centres
  seatScatterR: 0.25,    // local sphere around a section centre
  goldenAngle: 2.39996,
  gateOffsetX: 0.13,     // AI-Joe left of origin, Marcus right. Was 0.07; their labels ran together (Joe, 2026-09-24)
  coreAt: [0, 0, 0],
  joeAt: [0, 1.12, 0],    // above the whole team; yaw spins about Y so up stays up
  fileShellR: 1.3,
  fileSlots: 14,
  outerShellR: 1.6,      // web and app nodes, outside the files
  outerSlots: 7,         // one Web node plus the six app slots
  sceneRadius: 1.6,      // the depth ramp runs across this
};

// ------------------------------------------------------------------ maths
const clamp = (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v);
const lerp = (a, b, k) => a + (b - a) * k;
const rad = (d) => (d * Math.PI) / 180;
const easeInOut = (k) => (k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);
const basename = (p) => String(p).split('/').pop();
const firstName = (n) => String(n).replace(/^(dr|mr|mrs|ms|prof)\.?\s+/i, '').split(/\s+/)[0];

/**
 * The golden angle point set from the spec, verbatim.
 * z = 1 - (2i+1)/n, r = sqrt(1-z*z), theta = i * 2.39996.
 * Used three times: section centres, seats inside a section, file shell.
 */
function goldenPoint(i, n, radius, centre) {
  const z = 1 - (2 * i + 1) / n;
  const r = Math.sqrt(Math.max(0, 1 - z * z));
  const theta = i * LAYOUT.goldenAngle;
  return {
    x: (centre ? centre.x : 0) + radius * r * Math.cos(theta),
    y: (centre ? centre.y : 0) + radius * r * Math.sin(theta),
    z: (centre ? centre.z : 0) + radius * z,
  };
}

const cam = {
  yaw: CONFIG.yawStart,
  pitch: rad(CONFIG.elevationDeg),
  distance: CONFIG.distance,
  yawVel: 0,
  pitchVel: 0,
  lastInput: 0,
  tween: null,
};

/** World point to camera space. Yaw about Y, then pitch about X, then push back. */
function toCamera(p) {
  const cy = Math.cos(cam.yaw);
  const sy = Math.sin(cam.yaw);
  const x1 = p.x * cy - p.z * sy;
  const z1 = p.x * sy + p.z * cy;
  const cp = Math.cos(cam.pitch);
  const sp = Math.sin(cam.pitch);
  return {
    x: x1,
    y: p.y * cp - z1 * sp,
    z: p.y * sp + z1 * cp + cam.distance,
  };
}

/** Camera space to screen. Null behind the lens. */
function project(c) {
  if (c.z < 0.15) return null;
  const s = (view.focal || CONFIG.focal) / c.z;
  return { x: view.cx + c.x * s, y: view.cy - c.y * s, z: c.z, scale: s };
}

/** 0 at the front of the scene, 1 at the back. Drives every depth cue. */
function depthK(z) {
  const near = cam.distance - LAYOUT.sceneRadius;
  const far = cam.distance + LAYOUT.sceneRadius;
  return clamp((z - near) / (far - near || 1), 0, 1);
}

// ------------------------------------------------------------------ scene

const scene = { nodes: new Map(), fileSlots: [], outerSlots: [] };

function buildScene() {
  // Four seat sections. Gates is the bench's fifth section and its two seats
  // are the hub at the centre, not part of the arrangement.
  const ring = Brain.bench.filter((s) => !s.gate);
  const sections = Brain.sections.filter((name) => ring.some((s) => s.section === name));

  sections.forEach((name, si) => {
    const centre = goldenPoint(si, sections.length, LAYOUT.clusterR, null);
    const seats = ring.filter((s) => s.section === name);
    const color = PALETTE.sections[name] || PALETTE.sections[String(name).split(/[\s,]+/)[0]]
      || PALETTE.sectionOrder[si] || PALETTE.file;
    seats.forEach((seat, i) => {
      scene.nodes.set('seat:' + seat.slug, {
        key: 'seat:' + seat.slug,
        kind: 'seat',
        pos: goldenPoint(i, seats.length, LAYOUT.seatScatterR, centre),
        worldR: CONFIG.seatWorldR,
        color,
        label: firstName(seat.name),
        role: seat.title || '',
        stagger: i % 2,
        labelSize: CONFIG.labelWorldSize,
      });
    });
  });

  for (const gate of Brain.bench.filter((s) => s.gate)) {
    const side = gate.slug === 'ai-joe' ? -1 : 1;
    scene.nodes.set('seat:' + gate.slug, {
      key: 'seat:' + gate.slug,
      kind: 'gate',
      pos: { x: side * LAYOUT.gateOffsetX, y: 0, z: 0 },
      worldR: CONFIG.gateWorldR,
      color: PALETTE.gates[gate.slug] || PALETTE.core,
      label: firstName(gate.name),
      role: gate.title || '',
      labelSize: CONFIG.labelWorldSize,
    });
  }

  scene.nodes.set('joe', {
    key: 'joe',
    kind: 'human',
    pos: { x: LAYOUT.joeAt[0], y: LAYOUT.joeAt[1], z: LAYOUT.joeAt[2] },
    worldR: CONFIG.joeWorldR,
    color: PALETTE.joe,
    label: 'Joe',
    role: Brain.LABELS.joeRole,
    labelSize: CONFIG.labelWorldSize * 1.15,
  });

  scene.nodes.set('core', {
    key: 'core',
    kind: 'core',
    pos: { x: LAYOUT.coreAt[0], y: LAYOUT.coreAt[1], z: LAYOUT.coreAt[2] },
    worldR: CONFIG.coreWorldR,
    color: PALETTE.core,
    // Unlabelled until 2026-09-24, when Joe asked what the third centre light
    // was. It is the main session: Claude, the session Joe talks to. Its label
    // sits above the node so it never collides with the gates' labels below.
    label: 'Claude',
    role: 'Main session',
    alwaysRole: true,
    labelAbove: true,
    labelSize: CONFIG.labelWorldSize,
  });

  // The outer file shell. Files belong to no one seat, so they are spread
  // evenly over the sphere rather than clustered by section.
  scene.fileSlots = [];
  for (let i = 0; i < LAYOUT.fileSlots; i += 1) {
    scene.fileSlots.push({ taken: false, pos: goldenPoint(i, LAYOUT.fileSlots, LAYOUT.fileShellR, null) });
  }
  // The outer shell. Slot zero is the Web node, the rest are connectors.
  scene.outerSlots = [];
  for (let i = 0; i < LAYOUT.outerSlots; i += 1) {
    scene.outerSlots.push({ taken: false, pos: goldenPoint(i, LAYOUT.outerSlots, LAYOUT.outerShellR, null) });
  }
}

// ------------------------------------------------------------ replay state

const state = {
  mode: 'REPLAY',   // REPLAY, LIVE or DEMO. The single source of truth for all three.
  t: 0,
  playing: true,
  holdUntil: 0,
  fadeFrom: null,   // frozen last frame during the cross fade back to the start
  fadeStart: 0,
  cursor: 0,
  touched: new Set(),
  files: new Map(),
  log: [],          // activity panel entries, newest first
  logSeq: 0,
  logReset: true,
  pulses: [],
  edges: [],
  // session id -> Map(agent_id -> { agent, seat, slug, since }). Kept here
  // rather than read from Brain.at, because parentage has to be decided at the
  // moment a start is applied, not at the moment a frame is drawn.
  awakeBySession: new Map(),
  threads: new Map(),       // node key -> { since } while a seat is awake
  waits: new Map(),         // session id -> { key, kind, since }, one per session
  dips: new Map(),          // node key -> when the dip started
  working: new Map(),       // node key -> ts of the last quiet tool, decays
  outsidePulse: new Map(),  // node key -> when that seat last pulsed outside
  chips: new Map(),  // agent_id -> { el, pulsedAt }
};

/**
 * Live mode.
 *
 * REPLAY is a recording of one session, paced for a viewer. LIVE is the whole
 * machine: every session appending to today's log, shown as it lands, at real
 * time, with no pacing. The two never blend. Entering live wipes the replay
 * off the scene first, so nothing on screen is ever part recording.
 *
 * awake is kept here rather than derived from Brain.at, because Brain.events
 * holds the replay session and live is not one session. It is fed only by real
 * SubagentStart and SubagentStop lines, seeded from today's file on the way in,
 * so a seat that woke before the page opened and has not returned is awake.
 */
const live = {
  cursor: null,
  awake: new Map(),     // agent_id -> the same shape Brain.at().awake yields
  lastEventAt: 0,
  polling: false,
  timer: null,
  projects: new Set(),
};

/** David, 2026-09-24. Kind reads as shape, never as colour or size. */
function shapeFor(kind) {
  if (kind === 'method' || kind === 'method-global') return 'diamond';
  if (kind === 'web') return 'hexOutline';
  if (kind === 'app') return 'roundedOutline';
  if (kind === 'code') return 'triangle';
  if (Brain.isMemoryKind(kind)) return 'circle';
  return 'ring';   // page and document: a circle with a thin outline, no fill
}

/** Truncate, then an ellipsis. The full label is on the node's own record. */
function clipLabel(text) {
  const t = String(text || '');
  return t.length <= CONFIG.fileLabelMaxChars ? t
    : t.slice(0, CONFIG.fileLabelMaxChars) + '...';
}

/**
 * The node for work that reached outside this machine.
 *
 * One Web node for every search and fetch, and one node per connector, capped
 * at six with the oldest leaving when a seventh arrives. Created on first use
 * rather than drawn empty: the bench is a roster and is drawn idle, the
 * outside world is not a roster and only exists once it has happened.
 */
function touchOutside(e, animate) {
  const web = e.tool !== 'mcp';
  const key = web ? 'web' : 'app:' + String(e.target || 'unknown').toLowerCase();
  const found = scene.nodes.get(key);
  if (found && !found.dyingAt) {
    found.lastTs = e.ts_ms;
    return found;
  }
  if (!web) {
    const apps = [...scene.nodes.values()].filter((n) => n.kind === 'app' && !n.dyingAt);
    if (apps.length >= CONFIG.appCap) {
      let oldest = apps[0];
      for (const a of apps) if (a.lastTs < oldest.lastTs) oldest = a;
      oldest.dyingAt = performance.now();
      if (oldest.slot) oldest.slot.taken = false;
    }
  }
  // Slot zero belongs to the Web node so it never moves. Connectors take what
  // is free after it.
  const slot = web ? scene.outerSlots[0]
    : (scene.outerSlots.slice(1).find((x) => !x.taken) || scene.outerSlots[1]);
  slot.taken = true;
  const label = web ? 'Web' : Brain.serverName(e.target);
  const node = {
    key,
    kind: web ? 'web' : 'app',
    shape: web ? 'hexOutline' : 'roundedOutline',
    slot,
