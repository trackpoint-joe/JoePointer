<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The replay moved from /brain to /expert-team on 2026-10-14. The old address
     was shared with a handful of people, so it stays and forwards rather than
     returning a 404. GitHub Pages serves no server redirects, so this is a meta
     refresh plus a script; the canonical and the noindex keep search on the new
     address, and the link below is what a reader sees if neither runs. -->
<title>Moved to /expert-team</title>
<meta name="robots" content="noindex, follow">
<link rel="canonical" href="https://joepointer.com/expert-team/">
<meta http-equiv="refresh" content="0; url=/expert-team/">
<script>
  // Keeps any #hash and ?query, so a shared deep link still lands where it meant to.
  location.replace('/expert-team/' + location.search + location.hash);
</script>
<style>
  body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
         background: #0b0b0d; color: #e9e6df; font: 16px/1.6 system-ui, -apple-system, Segoe UI, sans-serif; }
  p { margin: 0; padding: 24px; text-align: center; }
  a { color: #d8b45a; }
</style>
</head>
<body>
<p>This page now lives at <a href="https://joepointer.com/expert-team/">joepointer.com/expert-team</a>.</p>
</body>
</html>
