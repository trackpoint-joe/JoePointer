    pos: slot.pos,
    lastTs: e.ts_ms,
    worldR: web ? CONFIG.webWorldR : CONFIG.appWorldR,
    color: PALETTE.outside,
    label: clipLabel(label),
    labelFull: label,
    hoverLabel: label,
    labelSize: CONFIG.fileLabelWorldSize,
    bornAt: animate ? performance.now() : 0,
  };
  scene.nodes.set(key, node);
  return node;
}

function touchFile(path, ts, animate, e) {
  const found = state.files.get(path);
  if (found && !found.dying) {
    found.lastTs = ts;
    return found.node;
  }
  const live = [...state.files.values()].filter((f) => !f.dying);
  if (live.length >= CONFIG.memoryCap) {
    let oldest = live[0];
    for (const f of live) if (f.lastTs < oldest.lastTs) oldest = f;
    retireFile(oldest, animate);
  }
  const slot = scene.fileSlots.find((s) => !s.taken) || scene.fileSlots[0];
  slot.taken = true;
  // The label is words, the shape is the kind, and the basename waits for a
  // hover. Yusuf owns the words, David owns the display, and neither of them
  // is a second permanent line on the screen.
  const fileKind = (e && e.kind) || Brain.fileKind(path);
  const full = e ? Brain.labelForEvent(e) : Brain.fileLabel(path);
  const node = {
    key: 'file:' + path,
    kind: 'file',
    fileKind,
    shape: shapeFor(fileKind),
    pos: slot.pos,
    worldR: CONFIG.fileWorldR,
    color: PALETTE.file,
    label: clipLabel(full),
    labelFull: full,
    hoverLabel: basename(path),
    labelSize: CONFIG.fileLabelWorldSize,
    bornAt: animate ? performance.now() : 0,
  };
  scene.nodes.set(node.key, node);
  state.files.set(path, { path, slot, lastTs: ts, node, dying: false });
  return node;
}

function retireFile(f, animate) {
  state.files.delete(f.path);
  f.slot.taken = false;
  f.dying = true;
  if (!animate) {
    scene.nodes.delete(f.node.key);
    return;
  }
  f.node.dyingAt = performance.now();  // drawFrame removes it when the fade ends
}

// ------------------------------------------------------------- animations

/**
 * How a memory event should look, or null when it is an ordinary one.
 *
 * The one place that decides a memory event differs from any other. It is
 * called where a file edge and its pulses are spawned, so David's round trip
 * drops in here and nothing else in the renderer had to move for it.
 *
 * Memory is Yusuf's memory kind and nothing else. A read of the bench or the
 * charter is method, and it behaves exactly as it did yesterday.
 */
function memoryEventStyle(e) {
  const kind = e.kind || Brain.fileKind(e.path);
  if (!Brain.isMemoryKind(kind)) return null;
  const write = e.tool === 'Write' || e.tool === 'Edit';
  return {
    memory: true,
    write,
    color: PALETTE.memoryEvent,
    ms: write ? CONFIG.memoryWriteMs : CONFIG.memoryEventMs,
  };
}

function spawnPulse(node, tool, style) {
  state.pulses.push({
    node,
    born: performance.now(),
    write: tool === 'Write' || tool === 'Edit',
    // A memory event rings twice. Same glyph rule as everything else: a ring
    // is a read, a ring with a filled dot is a write or an edit.
    double: Boolean(style && style.memory),
    color: (style && style.color) || PALETTE.pulse,
  });
}

function nodeFor(e) {
  if (e.seat_slug) return scene.nodes.get('seat:' + e.seat_slug);
  if (!e.agent && !e.agent_id) return scene.nodes.get('core');
  return null;   // a non seat agent has no node in the scene, only a tray chip
}

function applyEvent(e, animate, meta) {
  if (Brain.isJoe(e)) { applyJoe(e, animate, meta); return; }
  // The gate returning arms the handoff. Any other seat doing anything at all
  // disarms it, because then the next thing Joe answers is not what AI-Joe
  // handed him. Main session and non seat events leave it armed: they are not
  // seats and they do not break the chain.
  if (e.seat_slug === 'ai-joe' && e.event === 'SubagentStop') {
    state.handoff = { ts_ms: e.ts_ms };
  } else if (e.seat_slug) {
    state.handoff = null;
  }
  const node = nodeFor(e);
  if (node) state.touched.add(node.key);

  // Who is awake in this session, which is what parentage is decided from.
  if (e.event === 'SubagentStart' && e.agent_id) {
    let live = state.awakeBySession.get(e.session_id);
    if (!live) { live = new Map(); state.awakeBySession.set(e.session_id, live); }

    // The parent is the session's main thread unless something that could have
    // started this seat was already running. Then it is unknown, and unknown
    // draws nothing.
    const spawner = [...live.values()].some((x) => Brain.couldSpawn(x));
    live.set(e.agent_id, { agent: e.agent, seat: e.seat, slug: e.seat_slug, since: e.ts_ms });

    if (node && !spawner) {
      state.threads.set(node.key, { since: e.ts_ms });
      if (animate && CONFIG.showParentage) {
        const core = scene.nodes.get('core');
        if (core) {
          state.edges.push({
            from: core, to: node, born: performance.now(),
            ms: CONFIG.startLinkMs, color: PALETTE.label, straight: true,
          });
        }
      }
    }
    state.touched.add(node ? node.key : 'core');
    pushLog(e, node ? node.color : null, animate,
      { ...meta, parentUnknown: spawner, since: e.ts_ms });
    return;
  }

  if (e.event === 'SubagentStop' && e.agent_id) {
    const live = state.awakeBySession.get(e.session_id);
    const was = live && live.get(e.agent_id);
    if (live) live.delete(e.agent_id);
    if (node && state.threads.has(node.key)) {
      state.threads.delete(node.key);
      if (animate && CONFIG.showParentage) {
        const core = scene.nodes.get('core');
        if (core) {
          state.edges.push({
            from: node, to: core, born: performance.now(),
            ms: CONFIG.returnLinkMs, color: PALETTE.label, straight: true,
          });
        }
      }
    }
    if (node) state.touched.add(node.key);
    pushLog(e, node ? node.color : null, animate,
      { ...meta, ranFor: was ? e.ts_ms - was.since : null });
    return;
  }

  // Waiting on Joe. The asking node is the seat, or Claude's core when it is
  // the main session, and the wait is held per session because two sessions
  // can be waiting on him at once and each is its own line.
  if (Brain.isWait(e)) {
    const asking = node || scene.nodes.get('core');
    state.waits.set(e.session_id, {
      key: asking ? asking.key : 'core',
      kind: Brain.isTurnWait(e) ? 'turn' : 'decision',
      since: e.ts_ms,
    });
    state.touched.add('joe');
    pushLog(e, PALETTE.joe, animate, meta);
    return;
  }

  // Anything else from this session means the wait is over. There is no
  // approval event to listen for: Joe answering is the session moving again.
  if (state.waits.has(e.session_id)) state.waits.delete(e.session_id);

  // A call that did not work, and a call auto mode refused. Both dip the actor
  // twice and leave nothing behind. Never Joe's node: he did not fail.
  if (e.event === 'PostToolUseFailure' || e.event === 'PermissionDenied') {
    if (node && node.key !== 'joe') {
      state.touched.add(node.key);
      if (animate) state.dips.set(node.key, performance.now());
    }
    pushLog(e, PALETTE.failure, animate, meta);
    return;
  }

  // Bash, PowerShell, Grep and Glob. Bea: they hold the seat looking busy and
  // nothing else. No pulse, no edge, no node, nothing that accumulates.
  if (e.event === 'PostToolUse' && Brain.isQuietTool(e.tool)) {
    if (node) state.working.set(node.key, e.ts_ms);
    pushLog(e, node ? node.color : null, animate, meta);
    return;
  }

  // Work that reached outside this machine.
  if (e.event === 'PostToolUse' && Brain.isOutsideTool(e.tool)) {
    const out = touchOutside(e, animate);
    state.touched.add(out.key);
    if (animate && node) {
      const now = performance.now();
      // One outside pulse per seat per window. A seat fetching forty pages
      // must not read as forty times the work. Bea, 2026-09-24.
      const last = state.outsidePulse.get(node.key) || 0;
      if (now - last >= CONFIG.webPulseThrottleMs) {
        state.outsidePulse.set(node.key, now);
        spawnPulse(node, 'Read', { color: PALETTE.outsideEvent });
        spawnPulse(out, 'Read', { color: PALETTE.outsideEvent });
      }
      // Straight and radial: out of the seat, across the file shell, to the
      // doorway. Bowing it would make it read as the memory loop.
      state.edges.push({
        from: node, to: out, born: now,
        ms: CONFIG.webEdgeMs, color: PALETTE.outsideEvent, straight: true,
      });
    }
    pushLog(e, PALETTE.outsideEvent, animate, meta);
    return;
  }

  if (e.event === 'PostToolUse' && e.path) {
    const file = touchFile(e.path, e.ts_ms, animate, e);
    state.touched.add(file.key);
    if (animate) {
      const style = memoryEventStyle(e);
      if (node) {
        // On a memory read the seat stays quiet on the way out and rings when
        // the loop comes back, which is the whole point of the round trip. On
        // a memory write the seat rings as the actor and the filled dot lands
        // on the file. Everything else is unchanged.
        if (!style) spawnPulse(node, e.tool);
        else if (style.write) spawnPulse(node, 'Read', style);
        state.edges.push({ from: node, to: file, born: performance.now(), ...(style || {}) });
      } else {
        // The work is real and the agent is not on the bench. The file lights
        // and its chip in the tray flashes. Nothing is drawn into the scene,
        // because the spec keeps non seats out of it on purpose.
        const chip = state.chips.get(e.agent_id);
        if (chip) chip.pulsedAt = performance.now();
        spawnPulse(file, e.tool, style);
      }
    }
  }

  pushLog(e, node ? node.color : null, animate, meta);
}

/** One row on the activity panel. The only place the log array grows. */
function pushLog(e, color, animate, meta) {
  state.logSeq += 1;
  state.log.unshift({ e, color, seq: state.logSeq, fresh: animate, ...meta });
  if (state.log.length > CONFIG.logMax) state.log.length = CONFIG.logMax;
}

/**
 * Human in the Lead. Joe's node lights when he speaks or answers a decision.
 * If AI-Joe returned since Joe last weighed in, the handoff edge runs from the
 * voice gate up to Joe: the order is real, it is in the log. What the log
 * cannot say is whether he approved, because what he said is never recorded.
 */
function applyJoe(e, animate, meta) {
  const joe = scene.nodes.get('joe');
  const armed = state.handoff;
  const after = Boolean(armed) && (e.ts_ms - armed.ts_ms) <= CONFIG.handoffWindowMs;
  state.handoff = null;
  state.touched.add('joe');
  if (animate) {
    spawnPulse(joe, e.tool ? 'Write' : 'Read');
    if (after) {
      const gate = scene.nodes.get('seat:ai-joe');
      if (gate) {
        state.edges.push({
          from: gate, to: joe, born: performance.now(),
          ms: CONFIG.handoffMs, color: PALETTE.handoff,
          label: Brain.LABELS.handoff,
        });
      }
    }
  }
  state.logSeq += 1;
  state.log.unshift({ e, color: PALETTE.joe, seq: state.logSeq, fresh: animate, afterAiJoe: after, ...meta });
  if (state.log.length > CONFIG.logMax) state.log.length = CONFIG.logMax;
}

function advanceTo(t, animate) {
  while (state.cursor < Brain.events.length && Brain.events[state.cursor].ts_ms <= t) {
    applyEvent(Brain.events[state.cursor], animate);
    state.cursor += 1;
  }
  state.t = t;
}

/** Jump anywhere, forwards or backwards, with no animation debt left over. */
function seek(t) {
  clearBoard();
  state.cursor = 0;
  advanceTo(t, false);
}

// ------------------------------------------------------------------- live

/** Wipe the board. Shared by seek and by the switch into live mode. */
function clearBoard() {
  state.pulses = [];
  state.edges = [];
  for (const f of state.files.values()) scene.nodes.delete(f.node.key);
  state.files.clear();
  for (const s of scene.fileSlots) s.taken = false;
  for (const n of [...scene.nodes.values()]) {
    if (n.kind === 'web' || n.kind === 'app') scene.nodes.delete(n.key);
  }
  for (const s of scene.outerSlots) s.taken = false;
  state.touched.clear();
  state.working.clear();
  state.waits.clear();
  state.awakeBySession.clear();
  state.threads.clear();
  state.dips.clear();
  state.outsidePulse.clear();
  state.log = [];
  state.logReset = true;
  state.handoff = null;
}

/** What the renderer asks each frame. Same shape from either mode. */
function currentAt() {
  if (state.mode === 'LIVE') {
    const awake = [...live.awake.values()];
    return { t: Date.now(), awake, seatsAwake: awake.filter((a) => a.seat).map((a) => a.slug), edges: [], seen: 0, last: null };
  }
  return Brain.at(state.t);
}

/** A live line changes who is awake only when it really is a Start or a Stop. */
function trackAwake(e) {
  if (!e.agent_id) return;
  if (e.event === 'SubagentStart') {
    live.awake.set(e.agent_id, {
      agent_id: e.agent_id,
      agent: e.agent,
      seat: e.seat,
      slug: e.seat_slug,
      name: e.seat_slug ? (Brain.seat(e.seat_slug) || {}).name || e.agent : e.agent,
      since_ms: e.ts_ms,
      session_id: e.session_id,
      project: e.project,
      last: null,
    });
  } else if (e.event === 'SubagentStop') {
    live.awake.delete(e.agent_id);
  } else {
    const a = live.awake.get(e.agent_id);
    if (a) a.last = { tool: e.tool, path: e.path, ts_ms: e.ts_ms };
  }
}

function applyLiveBatch(events, animate) {
  for (const e of events) {
    trackAwake(e);
    if (e.project) live.projects.add(e.project);
    applyEvent(e, animate, { live: true, project: e.project });
  }
}

/**
 * Switch from the replay screensaver to the live machine.
 *
 * The batch that triggered the switch is already part of today's file, so the
 * seed and the batch overlap. They are separated on (ts_ms, seq), and seq is a
 * byte offset inside the same file, which makes the comparison exact rather
 * than a guess at equality between two copies of the same line. Everything
 * before the batch lands without animation, because it already happened. The
 * batch itself animates, so the event that woke live mode is seen.
 */
async function enterLive(batch) {
  const first = batch[0];
  const before = (e) => e.ts_ms < first.ts_ms || (e.ts_ms === first.ts_ms && e.seq < first.seq);

  let seed = { events: [] };
  try {
    seed = await Brain.tailFromDayStart();
  } catch (err) {
    seed = { events: [] };   // seeding is best effort; live still starts
  }

  state.mode = 'LIVE';
  state.playing = false;
  state.fadeFrom = null;
  state.holdUntil = 0;
  document.body.classList.add('live');
  clearBoard();
  live.awake.clear();
  live.projects.clear();

  const past = seed.events.filter(before);
  applyLiveBatch(past, false);
  // Awake is recomputed from the seed rather than trusted from the walk above,
  // so a Start whose Stop is missing stays awake and nothing else does.
  live.awake.clear();
  for (const a of Brain.awakeFrom(past)) live.awake.set(a.agent_id, a);

  applyLiveBatch(batch, true);
  live.lastEventAt = performance.now();
}

/** Quiet for long enough. Reload and go back to the screensaver. */
async function leaveLive() {
  state.mode = 'REPLAY';
  document.body.classList.remove('live');
  live.awake.clear();
  live.projects.clear();
  clearBoard();
  try {
    await Brain.load();
  } catch (err) {
    panelNote('The brain server stopped answering. Nothing on screen is current.');
    return;
  }
  state.playing = true;
  if (Brain.session) {
    seek(Brain.start);
  } else {
    panelNote('No session qualifies for replay. A seat has to have started and stopped in it.');
  }
}

async function pollTail() {
  if (live.polling) return;
  live.polling = true;
  try {
    const res = await Brain.tail(live.cursor);
    live.cursor = res.cursor;
    const events = res.events || [];
    if (events.length) {
      if (state.mode !== 'LIVE') {
        await enterLive(events);
      } else {
        // A long catch up, for example after the tab was hidden, lands without
        // animating everything at once. The tail is what is worth watching.
        const cut = Math.max(0, events.length - CONFIG.liveBurstCap);
        applyLiveBatch(events.slice(0, cut), false);
        applyLiveBatch(events.slice(cut), true);
        live.lastEventAt = performance.now();
      }
    } else if (state.mode === 'LIVE' && performance.now() - live.lastEventAt > CONFIG.liveIdleMs) {
      await leaveLive();
    }
  } catch (err) {
    // The server may be restarting. Keep the cursor and try again next tick.
  } finally {
    live.polling = false;
  }
}

function startPolling() {
  const tick = async () => {
    if (!document.hidden) await pollTail();
    live.timer = setTimeout(tick, CONFIG.livePollMs);
  };
  live.timer = setTimeout(tick, CONFIG.livePollMs);
}

// ------------------------------------------------------------------- glow

// One sprite per colour per shape, rendered once and blitted after that.
// Building a gradient per node per frame is the one thing that would actually
// cost frame time at this scene size, and it is entirely avoidable.
const sprites = new Map();

function hexAlpha(color, a) {
  if (color[0] === '#') {
    const h = color.slice(1);
    const full = h.length === 3 ? h.split('').map((x) => x + x).join('') : h.slice(0, 6);
    const n = parseInt(full, 16);
    return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
  }
  return color.replace(/rgba?\(([^)]+)\)/, (m, inner) =>
    `rgba(${inner.split(',').slice(0, 3).map((x) => x.trim()).join(', ')}, ${a})`);
}

/** A light, not a dot of paint: near white centre falling off to the hue. */
function discSprite(color) {
  const key = 'disc:' + color;
  if (sprites.has(key)) return sprites.get(key);
  const size = 128;
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, 'rgba(255, 255, 255, 0.95)');
  grad.addColorStop(0.16, hexAlpha(color, 0.92));
  grad.addColorStop(0.42, hexAlpha(color, 0.34));
  grad.addColorStop(1, hexAlpha(color, 0));
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  sprites.set(key, c);
  return c;
}

/** The expanding pulse. A camera facing glow annulus, so it reads at any angle. */
function ringSprite(color) {
  const key = 'ring:' + color;
  if (sprites.has(key)) return sprites.get(key);
  const size = 128;
  const c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(size / 2, size / 2, 0, size / 2, size / 2, size / 2);
  grad.addColorStop(0, hexAlpha(color, 0));
  grad.addColorStop(0.55, hexAlpha(color, 0.04));
  grad.addColorStop(0.76, hexAlpha(color, 0.85));
  grad.addColorStop(0.88, hexAlpha(color, 0.3));
  grad.addColorStop(1, hexAlpha(color, 0));
  g.fillStyle = grad;
  g.fillRect(0, 0, size, size);
  sprites.set(key, c);
  return c;
}

// ------------------------------------------------------------------- draw

const view = { w: 0, h: 0, cx: 0, cy: 0, dpr: 1 };
let canvas = null;
let ctx = null;
let hover = { x: -1, y: -1, key: null };

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, CONFIG.maxDpr);
  const w = canvas.clientWidth || window.innerWidth;
  const h = canvas.clientHeight || window.innerHeight;
  canvas.width = Math.round(w * dpr);
  canvas.height = Math.round(h * dpr);
  view.w = w;
  view.h = h;
  view.cx = (w - panelWidth()) / 2;
  view.cy = h / 2;
  // The zoom follows the screen. CONFIG.focal was tuned for a 1080px tall
  // desktop, so a 1920x1080 screen is unchanged; a phone is about a third of
  // that across and the brain ran off both edges and under the bottom bar
  // (Joe's screenshot, Samsung, 2026-09-24). The short side decides.
  view.focal = CONFIG.focal * clamp(Math.min(w, h) / CONFIG.focalRefPx, CONFIG.focalMinK, CONFIG.focalMaxK);
  view.dpr = dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function blitSprite(sprite, x, y, r, alpha) {
  if (alpha <= 0.002) return;
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.drawImage(sprite, x - r, y - r, r * 2, r * 2);
}

/**
 * Unit solids, built once and kept.
 *
 * Each is a list of vertices on the unit scale and a list of vertex index
 * pairs. Built on first use and cached: at most 14 file nodes and 7 outside
 * nodes are on screen, so the cost that matters is per frame projection, not
 * the one time each shape is described.
 */
const solids = new Map();

function buildSolid(kind) {
  const v = [];
  const e = [];
  const push = (x, y, z) => (v.push({ x, y, z }), v.length - 1);

  if (kind === 'globe') {
    const N = CONFIG.globeSamples;
    // Longitude great circles, each through both poles.
    for (let m = 0; m < CONFIG.globeLongitudes; m += 1) {
      const lon = (Math.PI * m) / CONFIG.globeLongitudes;
      const first = v.length;
      for (let i = 0; i < N; i += 1) {
        const a = (2 * Math.PI * i) / N;
        push(Math.cos(a) * Math.cos(lon), Math.sin(a), Math.cos(a) * Math.sin(lon));
        e.push([first + i, first + ((i + 1) % N)]);
      }
    }
    // The equator and one circle either side of it.
    for (let k = 0; k < CONFIG.globeLatitudes; k += 1) {
      const lat = (k - (CONFIG.globeLatitudes - 1) / 2) * rad(45);
      const r = Math.cos(lat);
      const y = Math.sin(lat);
      const first = v.length;
      for (let i = 0; i < N; i += 1) {
        const a = (2 * Math.PI * i) / N;
        push(Math.cos(a) * r, y, Math.sin(a) * r);
        e.push([first + i, first + ((i + 1) % N)]);
      }
    }
  } else if (kind === 'cube') {
    for (const x of [-1, 1]) for (const y of [-1, 1]) for (const z of [-1, 1]) push(x, y, z);
    for (let i = 0; i < 8; i += 1) {
      for (let bit = 1; bit <= 4; bit <<= 1) {
        const j = i ^ bit;
        if (j > i) e.push([i, j]);
      }
    }
  } else if (kind === 'octahedron') {
    push(1, 0, 0); push(-1, 0, 0); push(0, 1, 0); push(0, -1, 0); push(0, 0, 1); push(0, 0, -1);
    for (const a of [0, 1]) for (const b of [2, 3]) e.push([a, b]);
    for (const a of [0, 1]) for (const c of [4, 5]) e.push([a, c]);
    for (const b of [2, 3]) for (const c of [4, 5]) e.push([b, c]);
  } else if (kind === 'tetrahedron') {
    push(1, 1, 1); push(1, -1, -1); push(-1, 1, -1); push(-1, -1, 1);
    for (let i = 0; i < 4; i += 1) for (let j = i + 1; j < 4; j += 1) e.push([i, j]);
  } else {
    // A single great circle, tilted, which reads as a ring seen edge on from
    // some angles and open from others. That is the point of it being 3D.
    const N = CONFIG.globeSamples;
    const tilt = rad(CONFIG.ringTiltDeg);
    for (let i = 0; i < N; i += 1) {
      const a = (2 * Math.PI * i) / N;
      const x = Math.cos(a);
      const z = Math.sin(a);
      push(x, z * Math.sin(tilt), z * Math.cos(tilt));
      e.push([i, (i + 1) % N]);
    }
  }

  const solid = { v, e };
  solids.set(kind, solid);
  return solid;
}

/**
 * How far the unit solid has to be scaled to land where the flat glyph did.
 *
 * Each unit solid has its own circumradius, so one number cannot serve all of
 * them. The cube is given by its EDGE, which is 2 units before scaling, and
 * the globe is 1.3 times the hexagon it replaces, which was itself 1.3 node
 * radii. Getting this wrong is the difference between a shape and a blob.
 */
function solidScale(shape) {
  if (shape === 'hexOutline') return CONFIG.globeScale * 1.3;   // radius, 1.3 of the old hexagon
  if (shape === 'roundedOutline') return CONFIG.cubeScale / 2;  // edge 2 units before scaling
  if (shape === 'diamond') return 1.25;                         // octahedron, vertices at radius 1
  if (shape === 'triangle') return 1.35 / Math.sqrt(3);         // tetrahedron, vertices at radius sqrt 3
  return 1.15;                                                  // ring, radius 1
}

const SOLID_FOR = {
  hexOutline: 'globe',
  roundedOutline: 'cube',
  diamond: 'octahedron',
  triangle: 'tetrahedron',
  ring: 'ring',
};

/**
 * One wireframe solid around a node.
 *
 * The vertices are world space, offset from the node's own position and spun
 * on the vertical axis at a constant rate, then put through the same toCamera
 * and project every seat and file goes through. Each edge is dimmed by its own
 * depth, so the far side of a globe is quieter than the near side and the
 * shape reads as a solid rather than as a tangle.
 */
function drawSolid(node, scale, alpha, now) {
  const kind = SOLID_FOR[node.shape];
  if (!kind) return false;
  const solid = solids.get(kind) || buildSolid(kind);

  const spin = ((now % (CONFIG.solidSpinSecPerTurn * 1000)) / (CONFIG.solidSpinSecPerTurn * 1000))
    * Math.PI * 2;
  const cs = Math.cos(spin);
  const sn = Math.sin(spin);

  const pts = new Array(solid.v.length);
  const depth = new Array(solid.v.length);
  let anyBehind = false;
  for (let i = 0; i < solid.v.length; i += 1) {
    const u = solid.v[i];
    const c = toCamera({
      x: node.pos.x + (u.x * cs - u.z * sn) * scale,
      y: node.pos.y + u.y * scale,
      z: node.pos.z + (u.x * sn + u.z * cs) * scale,
    });
    const p = project(c);
    if (!p) { anyBehind = true; break; }
    pts[i] = p;
    depth[i] = c.z;
  }
  if (anyBehind) return false;

  // The node's own distance sets the middle of the range, so the dimming is
  // about this solid's own near and far sides and not about the whole scene.
  const mid = toCamera(node.pos).z;
  const spread = scale * 1.4 || 1;
  ctx.strokeStyle = node.color;
  ctx.lineWidth = Math.max(0.8, scale * 12);
  ctx.lineCap = 'round';
  for (const [a, b] of solid.e) {
    const near = 1 - clamp(((depth[a] + depth[b]) / 2 - (mid - spread)) / (2 * spread), 0, 1);
    ctx.globalAlpha = clamp(alpha * lerp(CONFIG.solidFarDim, 1, near), 0, 1);
    ctx.beginPath();
    ctx.moveTo(pts[a].x, pts[a].y);
    ctx.lineTo(pts[b].x, pts[b].y);
    ctx.stroke();
  }
  return true;
}

/** A hexagon or a rounded square, stroked, same radius and hue as each other. */
function drawOutline(node, x, y, r, alpha) {
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.strokeStyle = node.color;
  ctx.lineWidth = Math.max(1.2, r * 0.26);
  ctx.lineJoin = 'round';
  ctx.beginPath();
  if (node.shape === 'hexOutline') {
    for (let i = 0; i < 6; i += 1) {
      const a = rad(-90 + i * 60);
      const px = x + r * 1.3 * Math.cos(a);
      const py = y + r * 1.3 * Math.sin(a);
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  } else {
    const w = r * 1.15;
    const k = r * 0.45;
    ctx.moveTo(x - w + k, y - w);
    ctx.lineTo(x + w - k, y - w);
    ctx.quadraticCurveTo(x + w, y - w, x + w, y - w + k);
    ctx.lineTo(x + w, y + w - k);
    ctx.quadraticCurveTo(x + w, y + w, x + w - k, y + w);
    ctx.lineTo(x - w + k, y + w);
    ctx.quadraticCurveTo(x - w, y + w, x - w, y + w - k);
    ctx.lineTo(x - w, y - w + k);
    ctx.quadraticCurveTo(x - w, y - w, x - w + k, y - w);
  }
  ctx.stroke();
}

function drawNode(item, breath) {
  const { node, p, k, awake } = item;
  const since = item.since;
  const touched = state.touched.has(node.key);
  const fade = node.fadeK === undefined ? 1 : node.fadeK;
  const size = lerp(CONFIG.depthSizeNear, CONFIG.depthSizeFar, k);
  const glow = lerp(CONFIG.depthGlowNear, CONFIG.depthGlowFar, k);
  const rPx = node.worldR * p.scale * size;
  const breathK = awake ? breath : (item.ib || 1);

  ctx.globalCompositeOperation = 'lighter';
  // A failed or blocked call dips the actor twice and is gone. No new colour,
  // no badge, nothing that survives the dip.
  const dipAt = state.dips.get(node.key);
  let dip = 1;
  if (dipAt !== undefined) {
    const span = CONFIG.dipMs * 2 * CONFIG.dipCount;
    const age = performance.now() - dipAt;
    if (age >= span) state.dips.delete(node.key);
    else dip = lerp(CONFIG.dipTo, 1, Math.abs(Math.cos(Math.PI * age / CONFIG.dipMs)));
  }
  const halo = (awake ? CONFIG.haloAwake : touched ? CONFIG.haloTouched : CONFIG.haloIdle) * dip;
  blitSprite(discSprite(node.color), p.x, p.y, rPx * CONFIG.haloScale, halo * glow * fade * breathK);
  const body = (awake ? CONFIG.bodyAwake : touched ? CONFIG.bodyTouched : CONFIG.bodyIdle);
  if (SOLID_FOR[node.shape]) {
    // A wireframe solid in world space, so it turns with the orbit. The flat
    // outline is the fallback for the frame where a vertex is behind the lens.
    const scale = node.worldR * solidScale(node.shape);
    if (!drawSolid(node, scale, body * fade * breathK, performance.now())) {
      drawOutline(node, p.x, p.y, rPx, body * fade * breathK);
    }
  } else {
    blitSprite(discSprite(node.color), p.x, p.y, rPx * 1.35, body * fade * breathK);
  }

  if (node.kind === 'human') {
    // Waiting: the ring pulses on its own slow cycle so it reads as a state
    // rather than as an event that just happened.
    let ring = (touched ? 0.85 : 0.5) * glow * fade * breathK;
    if (waitingOnJoe()) {
      const phase = (performance.now() % CONFIG.waitRingMs) / CONFIG.waitRingMs;
      ring = (0.45 + 0.55 * (0.5 - 0.5 * Math.cos(2 * Math.PI * phase))) * glow * fade;
    }
    blitSprite(ringSprite(node.color), p.x, p.y, rPx * 2.6, ring);
  }

  if (!node.label) return;
  const hovered = hover.key === node.key;
  const px = clamp(node.labelSize * (CONFIG.labelScale || 1) * p.scale * size,
    CONFIG.labelMinPx, CONFIG.labelMaxPx);
  const labelAlpha = (hovered ? 1 : lerp(CONFIG.depthLabelNear, CONFIG.depthLabelFar, k) * fade) * intro.labelK;
  if (labelAlpha <= 0.02) return;
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = labelAlpha;
  ctx.font = `600 ${px.toFixed(1)}px ui-sans-serif, system-ui, "Segoe UI", sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const ly = node.labelAbove
    ? p.y - rPx * CONFIG.labelOffsetR - px * 1.2
    : p.y + rPx * CONFIG.labelOffsetR + px * 0.4 + (node.stagger ? CONFIG.labelStaggerPx : 0);
  ctx.lineWidth = Math.max(2, px * 0.18);
  ctx.strokeStyle = PALETTE.labelOutline;
  ctx.lineJoin = 'round';
  ctx.strokeText(node.label, p.x, ly);
  ctx.fillStyle = node.kind === 'file' ? PALETTE.muted : PALETTE.label;
  ctx.fillText(node.label, p.x, ly);

  // Time awake, under the name. One seat, one number, right now: nothing is
  // summed, nothing is ranked, and it disappears the moment the seat returns.
  if (CONFIG.showTimers && awake && since !== undefined && state.t >= since) {
    const tpx = Math.max(CONFIG.labelMinPx - 1, px * CONFIG.timerScale);
    ctx.globalAlpha = labelAlpha * 0.8;
    ctx.font = `500 ${tpx.toFixed(1)}px ui-monospace, Consolas, monospace`;
    ctx.lineWidth = Math.max(2, tpx * 0.18);
    ctx.strokeStyle = PALETTE.labelOutline;
    const ty = ly + px * 0.95;
    const text = Brain.elapsed(state.t - since);
    ctx.strokeText(text, p.x, ty);
    ctx.fillStyle = PALETTE.muted;
    ctx.fillText(text, p.x, ty);
  }

  if (!CONFIG.showRoles || !node.role) return;
  if (!hovered && !CONFIG.roleAlways && !node.alwaysRole && k > CONFIG.roleNearK) return;
  const roleDepth = Math.pow(lerp(CONFIG.depthLabelNear, CONFIG.depthLabelFar, k), CONFIG.roleDepthPower);
  const roleAlpha = (hovered ? 1 : roleDepth * CONFIG.roleAlpha) * fade * intro.labelK;
  if (roleAlpha <= 0.02) return;
  const rpx = Math.max(CONFIG.roleMinPx, px * CONFIG.roleScale);
  ctx.globalAlpha = roleAlpha;
  ctx.font = `400 ${rpx.toFixed(1)}px ui-sans-serif, system-ui, "Segoe UI", sans-serif`;
  const ry = ly + px * 0.62 + rpx * 0.55;
  ctx.lineWidth = Math.max(2, rpx * 0.2);
  ctx.strokeText(node.role, p.x, ry);
  ctx.fillStyle = PALETTE.muted || PALETTE.label;
  ctx.fillText(node.role, p.x, ry);
}

function drawPulse(pulse, now) {
  const age = (now - pulse.born) / CONFIG.pulseMs;
  if (age >= 1) return false;
  const c = toCamera(pulse.node.pos);
  const p = project(c);
  if (!p) return true;
  const k = depthK(c.z);
  const depth = lerp(CONFIG.depthEdgeNear, CONFIG.depthEdgeFar, k);
  const rPx = pulse.node.worldR * p.scale * lerp(CONFIG.depthSizeNear, CONFIG.depthSizeFar, k);
  const out = 1 - Math.pow(1 - age, 3);
  const color = pulse.color || PALETTE.pulse;
  const grown = rPx * (1.2 + (CONFIG.pulseGrowR - 1.2) * out);
  ctx.globalCompositeOperation = 'lighter';
  blitSprite(ringSprite(color), p.x, p.y, grown, (1 - age * age) * depth);
  // A memory event rings twice, concentric. The glyph rule is untouched: the
  // filled dot below is still what separates a write from a read.
  if (pulse.double) {
    blitSprite(ringSprite(color), p.x, p.y, grown * CONFIG.memoryRingGap,
      (1 - age * age) * depth * 0.8);
  }
  // Read is the expanding ring alone. Write and Edit add a filled dot held at
  // the centre, which is the 2D rule carried over: same colour, different glyph.
  if (pulse.write) {
    const dotAge = (now - pulse.born) / CONFIG.writeDotMs;
    if (dotAge < 1) {
      blitSprite(discSprite(color), p.x, p.y, rPx * CONFIG.writeDotR * 2.4, (1 - dotAge * dotAge) * depth);
    }
  }
  return true;
}

/**
 * One arc from a to b, bowed off the chord and projected per sample, so it
 * bends with the orbit instead of being a flat screen space cheat.
 */
function arcPoints(from, to, bow) {
  const pts = [];
  let zsum = 0;
  for (let i = 0; i <= CONFIG.edgeSamples; i += 1) {
    const u = i / CONFIG.edgeSamples;
    const c = toCamera({
      x: lerp(from.pos.x, to.pos.x, u),
      y: lerp(from.pos.y, to.pos.y, u) + Math.sin(u * Math.PI) * bow,
      z: lerp(from.pos.z, to.pos.z, u),
    });
    const p = project(c);
    if (!p) return null;
    zsum += c.z;
    pts.push(p);
  }
  return { pts, z: zsum / pts.length };
}

function strokeRun(pts, i0, i1, width, alpha, color) {
  if (i1 <= i0 || alpha <= 0.002) return;
  ctx.globalAlpha = clamp(alpha, 0, 1);
  ctx.strokeStyle = color;
  ctx.lineWidth = width;
  ctx.beginPath();
  ctx.moveTo(pts[i0].x, pts[i0].y);
  for (let i = i0 + 1; i <= i1; i += 1) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();
}

/**
 * The memory round trip. Joe asked for a loop that goes and comes back so it
 * reads as collecting something and bringing it home. Geometry and timing are
 * David's, judgment, outside seat, from design notes of 2026-09-24.
 *
 * A read is two legs that bow opposite ways off the same chord, so both are
 * visible at once and the return is not mistaken for a second outbound. The
 * file rings as the outbound leg lands, the seat rings when the bead arrives.
 * A write is one leg, no return, no bead, and the filled dot lands on the file.
 *
 * The pulses are fired from here, on a flag, because the moment they belong to
 * is a point along this edge's own life and nothing else knows where that is.
 */
function drawMemoryEdge(edge, now) {
  const t = now - edge.born;
  const chord = dist(edge.from.pos, edge.to.pos);
  const bow = chord * CONFIG.memoryLoopSpread;
  const head = CONFIG.edgeHeadFraction;
  const N = CONFIG.edgeSamples;
  const color = edge.color || PALETTE.memoryEvent;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';

  const out = arcPoints(edge.from, edge.to, bow);
  if (!out) return t < (edge.ms || CONFIG.memoryEventMs);
  const depth = lerp(CONFIG.depthEdgeNear, CONFIG.depthEdgeFar, depthK(out.z));

  const outK = clamp(t / CONFIG.memoryOutMs, 0, 1);
  const runHead = (pts, k, width, alpha) => {
    const lead = k * (1 + head);
    const i0 = Math.floor(clamp(lead - head, 0, 1) * N);
    const i1 = Math.ceil(clamp(lead, 0, 1) * N);
    strokeRun(pts, 0, N, CONFIG.edgeWidthPx, 0.14 * alpha * depth, color);
    strokeRun(pts, i0, i1, width, alpha * depth, color);
    return i1;
  };

  if (edge.write) {
    // One way. Same thin weight as a read's outbound leg.
    runHead(out.pts, outK, CONFIG.edgeWidthPx, CONFIG.memoryOutAlpha);
    if (outK >= 1) {
      if (!edge.firedFile) { edge.firedFile = true; spawnPulse(edge.to, 'Write', edge); }
      return false;
    }
    return true;
  }

  // Read. Outbound while it lasts, then the return along the other side.
  runHead(out.pts, outK, CONFIG.edgeWidthPx, CONFIG.memoryOutAlpha * (t < CONFIG.memoryOutMs ? 1 : 0.45));
  if (outK >= 1 && !edge.firedFile) {
    edge.firedFile = true;
    spawnPulse(edge.to, 'Read', edge);   // the file rings as the leg lands
  }
  if (t < CONFIG.memoryOutMs) return true;

  const back = arcPoints(edge.to, edge.from, -bow);
  if (!back) return true;
  const backK = clamp((t - CONFIG.memoryOutMs) / CONFIG.memoryReturnMs, 0, 1);
  const i1 = runHead(back.pts, backK, CONFIG.edgeWidthPx * CONFIG.memoryReturnWidthMul, CONFIG.memoryReturnAlpha);

  // The bead is the thing that says something came back.
  const bead = back.pts[Math.min(i1, N)];
  blitSprite(discSprite(color), bead.x, bead.y,
    CONFIG.edgeWidthPx * CONFIG.memoryBeadR * 2, 0.95 * depth);

  if (backK >= 1) {
    if (!edge.firedSeat) { edge.firedSeat = true; spawnPulse(edge.from, 'Read', edge); }
    return false;
  }
  return true;
}

function drawEdge(edge, now) {
  // A memory event is the only one that loops. Everything else is the one way
  // line it has always been, in the accent colour, with a single ring.
  if (edge.memory) return drawMemoryEdge(edge, now);
  const age = (now - edge.born) / (edge.ms || CONFIG.edgeMs);
  if (age >= 1) return false;
  // Sampled in 3D and projected per sample, so the line bends with the orbit
  // rather than being a flat screen space cheat.
  const pts = [];
  let zsum = 0;
  for (let i = 0; i <= CONFIG.edgeSamples; i += 1) {
    const u = i / CONFIG.edgeSamples;
    const lift = Math.sin(u * Math.PI) * (edge.straight ? 0 : CONFIG.edgeArc);
    const c = toCamera({
      x: lerp(edge.from.pos.x, edge.to.pos.x, u),
      y: lerp(edge.from.pos.y, edge.to.pos.y, u) + lift,
      z: lerp(edge.from.pos.z, edge.to.pos.z, u),
    });
    const p = project(c);
    if (!p) return true;
    zsum += c.z;
    pts.push(p);
  }
  const depth = lerp(CONFIG.depthEdgeNear, CONFIG.depthEdgeFar, depthK(zsum / pts.length));

  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  ctx.strokeStyle = edge.color || PALETTE.edge;
  ctx.globalAlpha = 0.16 * (1 - age) * depth;
  ctx.lineWidth = CONFIG.edgeWidthPx;
  ctx.beginPath();
  ctx.moveTo(pts[0].x, pts[0].y);
  for (let i = 1; i < pts.length; i += 1) ctx.lineTo(pts[i].x, pts[i].y);
  ctx.stroke();

  // The travelling head, which is what reads as a pulse crossing the gap.
  const head = CONFIG.edgeHeadFraction;
  const lead = age * (1 + head);
  const i0 = Math.floor(clamp(lead - head, 0, 1) * CONFIG.edgeSamples);
  const i1 = Math.ceil(clamp(lead, 0, 1) * CONFIG.edgeSamples);
  if (i1 > i0) {
    ctx.globalAlpha = 0.9 * (1 - age * age) * depth;
    ctx.lineWidth = CONFIG.edgeWidthPx * 2.2;
    ctx.beginPath();
    ctx.moveTo(pts[i0].x, pts[i0].y);
    for (let i = i0 + 1; i <= i1; i += 1) ctx.lineTo(pts[i].x, pts[i].y);
    ctx.stroke();
  }

  // A labelled edge says what it is for as long as it is drawn. Only the
  // handoff has one: an unlabelled gold line is a claim the viewer has to
  // guess at, which is the thing Marcus objected to.
  if (edge.label) {
    const end = pts[pts.length - 1];
    const px = clamp(CONFIG.labelWorldSize * 0.72 * end.scale, CONFIG.labelMinPx, CONFIG.labelMaxPx);
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = Math.min(1, (1 - age) * 1.6) * depth;
    ctx.font = `600 ${px.toFixed(1)}px ui-sans-serif, system-ui, "Segoe UI", sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.lineWidth = Math.max(2, px * 0.18);
    ctx.strokeStyle = PALETTE.labelOutline;
    ctx.lineJoin = 'round';
    const ly = end.y - px * 1.6;
    ctx.strokeText(edge.label, end.x, ly);
    ctx.fillStyle = edge.color || PALETTE.edge;
    ctx.fillText(edge.label, end.x, ly);
    ctx.globalCompositeOperation = 'lighter';
  }
  return true;
}

/**
 * The line that says Joe is being waited on.
 *
 * Held, not travelling: nothing is moving while a wait is open, and a
 * travelling head would say work is happening when the opposite is true. One
 * line per waiting session, from whoever asked up to Joe.
 *
 * A wait older than waitMaxMs is stale rather than waiting. A session that
 * ended without another event would otherwise hold the line for ever.
 */
/**
 * The thread from the main thread to a seat that is awake.
 *
 * Held and still: a seat being someone's child is a fact about the session,
 * not an event, so nothing travels along it. Quieter than the wait line on
 * purpose, because this is the ordinary case and Joe waiting is not.
 */
function drawThreads() {
  if (!CONFIG.showParentage || !state.threads.size) return;
  const core = scene.nodes.get('core');
  if (!core) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const key of state.threads.keys()) {
    const node = scene.nodes.get(key);
    if (!node) continue;
    const arc = arcPoints(core, node, 0);
    if (!arc) continue;
    strokeRun(arc.pts, 0, CONFIG.edgeSamples, CONFIG.edgeWidthPx,
      CONFIG.threadAlpha * lerp(CONFIG.depthEdgeNear, CONFIG.depthEdgeFar, depthK(arc.z)),
      PALETTE.label);
  }
}

function drawWaits(now) {
  for (const [session, wait] of [...state.waits]) {
    if (state.t - wait.since > CONFIG.waitMaxMs) { state.waits.delete(session); continue; }
    if (wait.kind === 'turn') continue;      // his turn breathes, it does not pull a line
    const from = scene.nodes.get(wait.key);
    const joe = scene.nodes.get('joe');
    if (!from || !joe) continue;
    const arc = arcPoints(from, joe, CONFIG.edgeArc * 0.5);
    if (!arc) continue;
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineCap = 'round';
    strokeRun(arc.pts, 0, CONFIG.edgeSamples, CONFIG.edgeWidthPx,
      CONFIG.waitLineAlpha * lerp(CONFIG.depthEdgeNear, CONFIG.depthEdgeFar, depthK(arc.z)),
      PALETTE.handoff);
  }
}

/** True while any session is waiting on a decision from Joe. */
function waitingOnJoe() {
  for (const w of state.waits.values()) if (w.kind === 'decision') return true;
  return false;
}

function drawFrame(at, now) {
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  ctx.fillStyle = PALETTE.bg;
  ctx.fillRect(0, 0, view.w, view.h);

  const phase = (now % CONFIG.breatheMs) / CONFIG.breatheMs;
  const breath = CONFIG.breatheMin +
    (CONFIG.breatheMax - CONFIG.breatheMin) * (0.5 - 0.5 * Math.cos(2 * Math.PI * phase));

  const awakeKeys = new Set();
  const awakeSince = new Map();
  for (const a of at.awake) {
    if (!a.seat) continue;
    awakeKeys.add('seat:' + a.slug);
    awakeSince.set('seat:' + a.slug, a.since_ms);
  }

  stepAmbient(now);
  drawAmbient(now);
  drawIntroStars(now);

  // Painter's algorithm: everything sorted by camera space z, far to near.
  const items = [];
  for (const node of scene.nodes.values()) {
    if (node.dyingAt) {
      const k = (now - node.dyingAt) / CONFIG.fadeMs;
      if (k >= 1) { scene.nodes.delete(node.key); continue; }
      node.fadeK = 1 - k;
    } else if (node.bornAt) {
      const k = (now - node.bornAt) / CONFIG.fadeMs;
      node.fadeK = k >= 1 ? 1 : k;
      if (k >= 1) node.bornAt = 0;
    } else {
      node.fadeK = 1;
    }
    const c = toCamera(node.pos);
    const p = project(c);
    if (!p) continue;
    // A quiet tool holds a node looking busy for a moment, then it decays on
    // its own. It shows work without scoring it, which is Bea's whole rule.
    const busyAt = state.working.get(node.key);
    const busy = busyAt !== undefined && state.t - busyAt >= 0
      && state.t - busyAt <= CONFIG.workingHoldMs;
    items.push({ node, p, z: c.z, k: depthK(c.z),
      awake: awakeKeys.has(node.key) || busy, ib: idleBreath(node, now),
      // Elapsed from the event timestamps, so a sped up replay still shows how
      // long the seat really took. Bea, 2026-09-24.
      since: awakeSince.get(node.key) });
  }
  items.sort((a, b) => b.z - a.z);

  hover.key = null;
  if (hover.x >= 0) {
    let best = Infinity;
    for (const item of items) {
      const d = Math.hypot(item.p.x - hover.x, item.p.y - hover.y);
      const r = item.node.worldR * item.p.scale + CONFIG.hoverSlopPx;
      if (d < r && d < best) { best = d; hover.key = item.node.key; }
    }
  }

  for (const item of items) drawNode(item, breath);
  drawThreads();
  drawWaits(now);
  state.edges = state.edges.filter((e) => drawEdge(e, now));
  state.pulses = state.pulses.filter((p) => drawPulse(p, now));

  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
}

// ---------------------------------------------------------------- ambient
// The brain is never still, and none of this is an event. See CONFIG.

const ambient = { web: [], dust: [], last: 0 };
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z);

/** A stable pseudo random number per key, so each node has its own rhythm. */
function seeded(key, salt) {
  let h = 2166136261 ^ salt;
  for (let i = 0; i < key.length; i += 1) { h ^= key.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 100000) / 100000;
}

function buildAmbient() {
  // Web: each seat to its nearest neighbours in the same section. Structure,
  // not traffic, so it shimmers as a whole and nothing travels along it.
  ambient.web = [];
  const seen = new Set();
  const seats = [...scene.nodes.values()].filter((n) => n.kind === 'seat');
  for (const a of seats) {
    const peers = seats
      .filter((b) => b !== a && b.color === a.color)
      .sort((b, c) => dist(a.pos, b.pos) - dist(a.pos, c.pos))
      .slice(0, CONFIG.webNeighbours);
    for (const b of peers) {
      const id = [a.key, b.key].sort().join('|');
      if (seen.has(id)) continue;
      seen.add(id);
      ambient.web.push({ a, b, color: a.color, phase: seeded(id, 7) });
    }
  }
  // Dust: motes adrift inside the shell, each on its own slow heading.
  ambient.dust = [];
  for (let i = 0; i < CONFIG.dustCount; i += 1) {
    const u = Math.random() * 2 - 1;
    const th = Math.random() * Math.PI * 2;
    const r = CONFIG.dustShellR * Math.cbrt(Math.random());
    const sq = Math.sqrt(1 - u * u);
    const pos = { x: r * sq * Math.cos(th), y: r * u, z: r * sq * Math.sin(th) };
    const v = { x: Math.random() - 0.5, y: Math.random() - 0.5, z: Math.random() - 0.5 };
    const vl = Math.hypot(v.x, v.y, v.z) || 1;
    const sp = CONFIG.dustSpeed * (0.5 + Math.random());
    ambient.dust.push({ pos, v: { x: (v.x / vl) * sp, y: (v.y / vl) * sp, z: (v.z / vl) * sp }, tw: Math.random() });
  }
}

/** Every node drifts gently around its home, each on its own periods. */
function stepAmbient(now) {
  const dt = ambient.last ? Math.min(now - ambient.last, 100) : 16;
  ambient.last = now;
  if (!CONFIG.ambient) return;
  const span = CONFIG.floatPeriodMaxMs - CONFIG.floatPeriodMinMs;
  for (const node of scene.nodes.values()) {
    if (!node.home) node.home = { x: node.pos.x, y: node.pos.y, z: node.pos.z };
    const amp = CONFIG.floatAmp * (node.kind === 'seat' ? 1 : 0.5);
    const px = CONFIG.floatPeriodMinMs + span * seeded(node.key, 1);
    const py = CONFIG.floatPeriodMinMs + span * seeded(node.key, 2);
    const pz = CONFIG.floatPeriodMinMs + span * seeded(node.key, 3);
    const ph = seeded(node.key, 4) * Math.PI * 2;
    node.pos = {
      x: node.home.x + amp * Math.sin((now / px) * Math.PI * 2 + ph),
      y: node.home.y + amp * Math.sin((now / py) * Math.PI * 2 + ph * 1.7),
      z: node.home.z + amp * Math.sin((now / pz) * Math.PI * 2 + ph * 2.3),
    };
  }
  const R = CONFIG.dustShellR;
  for (const d of ambient.dust) {
    d.pos.x += d.v.x * dt;
    d.pos.y += d.v.y * dt;
    d.pos.z += d.v.z * dt;
    if (Math.hypot(d.pos.x, d.pos.y, d.pos.z) > R) {
      // Leave one side of the shell, come back in on the other.
      d.pos.x *= -0.96;
      d.pos.y *= -0.96;
      d.pos.z *= -0.96;
    }
  }
}

/** Every node's halo breathes, out of phase with its neighbours. */
function idleBreath(node, now) {
  if (!CONFIG.ambient) return 1;
  const ph = seeded(node.key, 5);
  const w = 0.5 - 0.5 * Math.cos(((now / CONFIG.idleBreathMs) + ph) * Math.PI * 2);
  return 1 - CONFIG.idleBreathDepth + CONFIG.idleBreathDepth * w;
}

function drawAmbient(now) {
  if (!CONFIG.ambient) return;
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineWidth = 1;
  for (const w of ambient.web) {
    const ca = toCamera(w.a.pos);
    const cb = toCamera(w.b.pos);
    const pa = project(ca);
    const pb = project(cb);
    if (!pa || !pb) continue;
    const depth = lerp(CONFIG.depthEdgeNear, CONFIG.depthEdgeFar, (depthK(ca.z) + depthK(cb.z)) / 2);
    const shimmer = 0.55 + 0.45 * Math.sin(((now / CONFIG.webShimmerMs) + w.phase) * Math.PI * 2);
    ctx.globalAlpha = CONFIG.webAlpha * depth * shimmer;
    ctx.strokeStyle = w.color;
    ctx.beginPath();
    ctx.moveTo(pa.x, pa.y);
    ctx.lineTo(pb.x, pb.y);
    ctx.stroke();
  }
  ctx.fillStyle = PALETTE.dust;
  for (const d of ambient.dust) {
    const c = toCamera(d.pos);
    const p = project(c);
    if (!p) continue;
    const k = depthK(c.z);
    const tw = 0.6 + 0.4 * Math.sin(((now / 4000) + d.tw) * Math.PI * 2);
    ctx.globalAlpha = CONFIG.dustAlpha * lerp(1, 0.3, k) * tw;
    const sz = CONFIG.dustSizePx * lerp(1.2, 0.6, k);
    ctx.fillRect(p.x - sz / 2, p.y - sz / 2, sz, sz);
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

// -------------------------------------------------------------- overlays

const dom = (id) => document.getElementById(id);

/** True on a phone sized screen. The one test, used everywhere. */
function isPhone() {
  // Two conditions, matching the stylesheet. A phone in landscape is wider
  // than the breakpoint and shorter than a desktop, so height is what catches
  // it. Keep these two in step: the CSS decides what is drawn and this decides
  // how it behaves, and they must agree about what a phone is.
  if (typeof window.matchMedia === 'function') {
    return window.matchMedia('(max-width: ' + CONFIG.phoneMaxPx + 'px)').matches
      || window.matchMedia('(max-height: ' + CONFIG.phoneShortPx
        + 'px) and (orientation: landscape)').matches;
  }
  return window.innerWidth <= CONFIG.phoneMaxPx
    || (window.innerHeight <= CONFIG.phoneShortPx && window.innerWidth > window.innerHeight);
}
let lastNowPaint = 0;

function hideProvenance() {
  const box = dom('provenance');
  if (box) box.classList.add('hidden');
}

/**
 * The phone settings, applied on load and on every resize.
 *
 * Distance, label ceiling and the panel default are the three that would
 * otherwise make a phone look like a desktop squeezed. The panel starts closed
 * whatever the saved preference says: a sheet covering 60vh of a 375px screen
 * on arrival is not an activity panel, it is a wall.
 */
function applyPhone() {
  const phone = isPhone();
  document.body.classList.toggle('phone', phone);
  if (!phone) return;
  if (!state.phoneApplied) {
    state.phoneApplied = true;
    cam.distance = CONFIG.phoneDistance;
    setPanel(false);
  }
  CONFIG.labelMaxPx = CONFIG.phoneLabelMaxPx;
  // Roles on a tap only. roleNearK is the depth a role would otherwise appear
  // at; below zero, nothing reaches it and only the tapped node shows one.
  CONFIG.roleNearK = -1;
  if (CONFIG.dustCount > CONFIG.phoneDustCount && CONFIG.phoneDustBudget) {
    CONFIG.dustCount = CONFIG.phoneDustCount;
    buildAmbient();
  }
}

function paintOverlays(now) {
  // Two words, two colours, and a dot that only beats when the clock is the
  // system clock. From across the room the difference has to be obvious.
  if (state.mode === 'DEMO') {
    // Permanent. A demo never becomes live and never claims to be. The line
    // underneath is the pack's own provenance, and it is the only place the
    // page says where what you are watching came from, which is why the
    // fixture banner is not shown as well.
    // Never a bare DEMO while the pacing is on. The clock under it shows each
    // event's own time, and a viewer who is not told the gaps are compressed
    // will read the pace as real. Marcus, 2026-09-24.
    dom('markerText').textContent = CONFIG.demoPacing ? 'DEMO, SPED UP' : 'DEMO';
    dom('markerClock').textContent = Brain.clock(new Date(state.t).toISOString());
    const meta = Brain.meta || {};
    const held = Number(meta.dropped_by_policy || 0);
    // What the scrub removed is part of the provenance. A demo that quietly
    // drops events and says nothing is a demo that overstates the session.
    dom('markerWhere').textContent = (meta.note || 'provenance not stated') +
      (held > 0 ? ', ' + held + (held === 1 ? ' event withheld' : ' events withheld') : '');
  } else if (state.mode === 'LIVE') {
    dom('markerText').textContent = 'LIVE';
    dom('markerClock').textContent = Brain.clock(new Date().toISOString());
    const where = [...live.projects];
    dom('markerWhere').textContent = where.length === 1 ? where[0]
      : where.length ? where.length + ' projects' : 'watching the log';
  } else if (!Brain.session) {
    // Real log, nothing to replay yet: no seat has started and returned in any
    // session. Say so plainly; LIVE takes over the moment a line lands.
    dom('markerText').textContent = 'WAITING';
    dom('markerClock').textContent = '--:--:--';
  } else {
    dom('markerText').textContent = (CONFIG.demoPacing ? 'REPLAY, SPED UP' : 'REPLAY') + (state.playing ? '' : '  PAUSED');
    dom('markerClock').textContent = Brain.clock(new Date(state.t).toISOString());
    dom('markerWhere').textContent = Brain.session ? Brain.session.project : '';
  }
  if (now - lastNowPaint > CONFIG.nowTickMs) {
    lastNowPaint = now;
    // Live shows today's date under the clock, where NOW would only repeat it.
    // Replay and the demo never show a date: the demo's dates are moved to a
    // neutral day, and Joe kept replay to times only (2026-09-25).
    dom('markerNow').textContent = state.mode === 'LIVE'
      ? new Date().toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' })
      : 'NOW ' + Brain.clock(new Date().toISOString());
  }
  paintPanel();
  if (state.mode !== 'LIVE') {
    const span = Brain.end - Brain.start || 1;
    const pct = clamp((state.t - Brain.start) / span, 0, 1) * 100;
    dom('scrubFill').style.width = pct.toFixed(2) + '%';
    dom('scrubHead').style.left = pct.toFixed(2) + '%';
  }

  for (const chip of state.chips.values()) {
    const lit = chip.pulsedAt && now - chip.pulsedAt < CONFIG.pulseMs;
    chip.el.classList.toggle('pulsing', Boolean(lit));
  }
}

// ---------------------------------------------------------- activity panel

let panelShown = -1;  // seq of the newest entry already in the list

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

/** One event as a row. Built with textContent only; paths are never HTML. */
function entryFor(item) {
  const e = item.e;
  const li = el('li', 'entry');
  if (item.color) li.style.setProperty('--c', item.color);
  if (e.event !== 'PostToolUse') li.classList.add('lifecycle');
  // A failure and a block read quietly: faint text, one muted dot, no colour
  // anywhere else. They are information, not an alarm.
  if (e.event === 'PostToolUseFailure' || e.event === 'PermissionDenied') li.classList.add('failed');
  if (Brain.isWait(e)) li.classList.add('waiting');
  li.appendChild(el('span', 't', Brain.clock(e.ts)));
  li.appendChild(el('span', 'dot'));
  // Live covers every session on the machine, so a row has to say where it
  // happened. In replay every row is the one session and it would be noise.
  if (item.live && e.project) { li.classList.add('live-row'); li.appendChild(el('span', 'proj', e.project)); }

  const w = el('span', 'w');
  const seat = e.seat_slug ? Brain.seat(e.seat_slug) : null;
  if (Brain.isJoe(e)) {
    li.classList.add('joe');
    w.appendChild(el('b', '', 'Joe'));
    w.appendChild(el('span', 'role', ' ' + Brain.LABELS.joeRole));
    w.appendChild(document.createElement('br'));
    const said = e.event === 'UserPromptSubmit' ? 'spoke' : 'made a call';
    w.appendChild(document.createTextNode(item.afterAiJoe ? said + ' after AI-Joe returned' : said));
    li.appendChild(w);
    return li;
  }
  if (seat) {
    w.appendChild(el('b', '', firstName(seat.name)));
    if (seat.title) w.appendChild(el('span', 'role', ' ' + seat.title));
  } else if (e.agent) {
    w.appendChild(el('b', '', Brain.agentName(e.agent, e.owner_project_name)));
    w.appendChild(el('span', 'ns', ' ' + Brain.LABELS.notOnTeam));
  } else {
    w.appendChild(el('b', '', 'Main session'));
  }
  w.appendChild(document.createElement('br'));
  if (e.event === 'SubagentStart') {
    // No hook field names a parent. When something that could have started
    // this seat was already running, the honest row says so.
    w.appendChild(document.createTextNode(item.parentUnknown ? 'started (parent not reported)' : 'woke'));
  } else if (e.event === 'SubagentStop') {
    w.appendChild(document.createTextNode(
      item.ranFor ? 'returned after ' + Brain.elapsedWords(item.ranFor) : 'returned'));
  }
  else if (e.event === 'PermissionRequest' || e.event === 'Notification') {
    w.appendChild(document.createTextNode(
      Brain.isTurnWait(e) ? 'is waiting on Joe' : 'is waiting on Joe for a decision'));
  } else if (e.event === 'PermissionDenied') {
    w.appendChild(document.createTextNode('blocked by auto mode'));
  } else if (e.event === 'PostToolUseFailure') {
    w.appendChild(document.createTextNode('a ' + Brain.toolFamily(e.tool) + ' call failed'));
  }
  else if (Brain.outsideWords(e)) w.appendChild(document.createTextNode(Brain.outsideWords(e)));
  else {
    const verb = { Read: 'read ', Write: 'wrote ', Edit: 'edited ' }[e.tool] || String(e.tool).toLowerCase() + ' ';
    w.appendChild(document.createTextNode(verb));
    // The friendly label, not the basename. The path still sits on the small
    // line underneath, so nothing is hidden, only led with.
    w.appendChild(el('span', 'f', Brain.labelForEvent(e)));
  }
  li.appendChild(w);

  // The path line is dropped only when it would repeat the label word for
  // word, which happens in a scrubbed pack where the path is a bare basename.
  if (e.path && e.path !== Brain.labelForEvent(e)) {
    const full = el('div', 'p', e.path);
    full.title = e.path;
    li.appendChild(full);
  }
  return li;
}

let panelClock24 = null;

function paintPanel() {
  if (!document.body.classList.contains('panel-open')) return;
  const list = dom('panelList');
  // A clock format change redraws every row, not just the new ones.
  if (panelClock24 !== CONFIG.clock24) {
    panelClock24 = CONFIG.clock24;
    state.logReset = true;
  }
  if (state.logReset) {
    state.logReset = false;
    list.textContent = '';
    for (const item of state.log) list.appendChild(entryFor(item));
    panelShown = state.log.length ? state.log[0].seq : -1;
  } else if (state.log.length && state.log[0].seq > panelShown) {
    const fresh = state.log.filter((i) => i.seq > panelShown).reverse();
    for (const item of fresh) {
      const li = entryFor(item);
      if (item.fresh) li.classList.add('fresh');
      list.insertBefore(li, list.firstChild);
    }
    panelShown = state.log[0].seq;
    while (list.children.length > CONFIG.logMax) list.removeChild(list.lastChild);
  }
  dom('panelCount').textContent = state.log.length ? state.log.length + ' events' : '';
}

function panelNote(text) {
  const list = dom('panelList');
  list.textContent = '';
  list.appendChild(el('li', 'entry note', text));
}

function panelWidth() {
  return document.body.classList.contains('panel-open') ? dom('panel').offsetWidth : 0;
}

function setPanel(open) {
  document.body.classList.toggle('panel-open', open);
  // Remembered per viewer. Storage can be missing or blocked; that only means
  // the default applies next time.
  try { localStorage.setItem('brain.panelOpen', open ? '1' : '0'); } catch (err) { /* ignore */ }
  if (open) state.logReset = true;
}

function initPanel() {
  let open = CONFIG.panelOpenDefault;
  try {
    const saved = localStorage.getItem('brain.panelOpen');
    if (saved !== null) open = saved === '1';
  } catch (err) { /* ignore */ }
  setPanel(open);
  dom('panelClose').addEventListener('click', () => setPanel(false));
  dom('panelTab').addEventListener('click', () => setPanel(true));
  placePanel();
}

/** The panel starts under the fixture banner so it never hides it. */
function placePanel() {
  const banner = dom('banner');
  // Desktop only. On a phone the panel is a bottom sheet, and an inline top
  // here overrode the sheet's top:auto and pinned it to the top of the screen.
  // Found at 375x812 on 2026-09-24 after Joe saw an empty sheet on his phone.
  if (isPhone()) { dom('panel').style.top = ''; return; }
  const top = banner.classList.contains('hidden') ? 0 : banner.offsetHeight;
  dom('panel').style.top = top + 'px';
}

/** Ease the scene centre toward the middle of whatever space the panel leaves. */
function stepView() {
  const target = (view.w - panelWidth()) / 2;
  view.cx += (target - view.cx) * CONFIG.panelShiftEase;
  if (Math.abs(target - view.cx) < 0.25) view.cx = target;
}

/** Non seat agents live in the flat tray, never in the scene. Spec section 1. */
function syncChips(at) {
  const live = at.awake.filter((a) => !a.seat);
  const seen = new Set();
  for (const a of live) {
    seen.add(a.agent_id);
    if (state.chips.has(a.agent_id)) continue;
    const el = document.createElement('div');
    el.className = 'chip';
    // "ai-joe (CareerPointers)" and not a bare "ai-joe", which would read as
    // the bench's voice gate sitting in the wrong box.
    el.textContent = Brain.agentName(a.agent, a.owner);
    dom('trayChips').appendChild(el);
    state.chips.set(a.agent_id, { el, pulsedAt: 0 });
  }
  for (const [id, chip] of state.chips) {
    if (!seen.has(id)) { chip.el.remove(); state.chips.delete(id); }
  }
  // Joe, 2026-09-24: an empty box with a caption was confusing. The tray only
  // exists on screen while an outside agent is actually running.
  dom('tray').classList.toggle('empty', state.chips.size === 0);
  // On a phone the tray is one number in the bottom row. Same fact, one glyph.
  const count = dom('mTrayCount');
  if (count) {
    count.textContent = String(state.chips.size);
    dom('mTray').classList.toggle('empty', state.chips.size === 0);
  }
}

// ----------------------------------------------------------------- music

/**
 * The music selector.
 *
 * Never autoplays. A browser blocks sound before a gesture anyway, and a
 * screensaver that starts making noise on its own would be wrong even where it
 * is allowed. The last choice is remembered and restored into the selector,
 * silent, so Joe sees what he picked last time and one click starts it.
 *
 * Tracks come from /api/music on the loopback server, or from a manifest
 * embedded by tools/export_demo.py --with-music. No manifest and no route
 * means no tracks, and the control is not rendered at all.
 */
const music = { tracks: [], audio: null, muted: false, fade: null, current: '' };

function musicRemember(file) {
  try { localStorage.setItem('brain.music', file || ''); } catch (err) { /* fine */ }
}

function musicRecall() {
  try { return localStorage.getItem('brain.music') || ''; } catch (err) { return ''; }
}

/** Ease volume rather than cutting it, both on the way in and on the way out. */
function musicFade(to, done, ms) {
  if (music.fade) clearInterval(music.fade);
  const audio = music.audio;
  if (!audio) return;
  const from = audio.volume;
  const started = performance.now();
  music.fade = setInterval(() => {
    const k = clamp((performance.now() - started) / (ms || CONFIG.musicFadeMs), 0, 1);
    audio.volume = clamp(from + (to - from) * k, 0, 1);
    if (k >= 1) {
      clearInterval(music.fade);
      music.fade = null;
      if (done) done();
    }
  }, 16);
}

function musicPlay(file) {
  const track = music.tracks.find((t) => t.file === file);
  music.current = track ? file : '';
  musicRemember(music.current);
  if (!track) {
    if (music.audio) musicFade(0, () => { music.audio.pause(); });
    dom('musicMute').classList.remove('playing');
    return;
  }
  if (!music.audio) {
    music.audio = new Audio();
    music.audio.addEventListener('ended', () => musicAdvance());
  }
  // Repeat one loops the element itself. The other modes need the ended event,
  // so looping is off and musicAdvance picks what is next.
  music.audio.loop = musicMode() === 'one';
  music.audio.src = track.url;
  music.audio.volume = 0;
  music.audio.muted = music.muted;
  const started = music.audio.play();
  if (started && started.catch) {
    // Blocked before a gesture, which is the browser working as intended.
    started.catch(() => { dom('musicMute').classList.remove('playing'); });
  }
  musicFade(CONFIG.musicVolume);
  dom('musicMute').classList.add('playing');
}

/** The play mode, or repeat one when the drawer has not been built yet. */
function musicMode() {
  return (window.Settings && window.Settings.values.playMode) || 'one';
}

/** What plays after this track, in the order the drawer was given. */
function musicAdvance() {
  const order = (window.Settings && window.Settings.playlist().map((t) => t.file)) || [];
  if (!order.length) return;
  const mode = musicMode();
  if (mode === 'one') return;   // the element loops itself
  const here = order.indexOf(music.current);
  let next;
  if (mode === 'shuffle') {
    // Never the same track twice in a row when there is a choice.
    const pool = order.filter((f) => f !== music.current);
    next = pool[Math.floor(Math.random() * pool.length)] || order[0];
  } else {
    next = order[(here + 1) % order.length];
  }
  const pick = dom('musicPick');
  if (pick) pick.value = next;
  musicPlay(next);
}

/**
 * Quiet hours. It can silence what is playing and it can move past a track. It
 * can never start sound: a browser needs a gesture first, and a screensaver
 * that begins making noise on a schedule would be wrong even where it is
 * allowed. Checked on the system clock, once a minute.
 */
function musicQuietCheck() {
  if (!window.Settings || !music.audio || !music.current) return;
  const quiet = window.Settings.inQuietHours(new Date());
  if (quiet && !music.audio.paused) {
    musicFade(0, () => { music.audio.pause(); });
    dom('musicMute').classList.remove('playing');
  }
}

function musicToggleMute() {
  music.muted = !music.muted;
  if (music.audio) music.audio.muted = music.muted;
  dom('musicMute').classList.toggle('muted', music.muted);
}

async function initMusic() {
  const box = dom('music');
  const pick = dom('musicPick');
  if (!box || !pick) return;

  const tag = document.getElementById('brain-music');
  if (tag && tag.textContent.trim()) {
    try { music.tracks = JSON.parse(tag.textContent).tracks || []; } catch (err) { music.tracks = []; }
  } else {
    // Demo mode used to stay silent here. Joe cleared music for the demo on
    // 2026-09-24 (Suno plan permits commercial use), so the local /demo lists
    // the library too. The single exported file has no server to ask, the
    // fetch fails quietly, and it stays silent, which is what an emailed file
    // should be. The folder export carries its own manifest above.
    try {
      const res = await fetchJsonSafe('/api/music');
      music.tracks = (res && res.tracks) || [];
    } catch (err) {
      music.tracks = [];
    }
  }

  // The intro track plays only under the opening. It is not a listening
  // track, so it never appears in the picker or the playlist.
  const introTitle = Brain.LABELS.introTrack;
  music.intro = music.tracks.find((t) => introTitle && t.title === introTitle) || null;
  if (music.intro) music.tracks = music.tracks.filter((t) => t !== music.intro);

  if (!music.tracks.length) return;   // stays hidden, nothing to offer
  for (const t of music.tracks) {
    const opt = document.createElement('option');
    opt.value = t.file;
    opt.textContent = t.title;
    pick.appendChild(opt);
  }
  const remembered = musicRecall();
  if (remembered && music.tracks.some((t) => t.file === remembered)) {
    // The selection comes back, the sound does not. Joe clicks to start it.
    pick.value = remembered;
  }
  box.classList.remove('hidden');
  pick.addEventListener('change', () => musicPlay(pick.value));
  dom('musicMute').addEventListener('click', musicToggleMute);
}

async function fetchJsonSafe(url) {
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(url + ' returned ' + res.status);
  return res.json();
}

// ---------------------------------------------------------------- camera

function wireInput() {
  let dragging = false;
  let lastX = 0;
  let lastY = 0;
  const pitchLimit = rad(CONFIG.pitchClampDeg);

  // Two fingers pinch, and while they are down the orbit is suspended: a pinch
  // that also spun the camera would feel like a fight with the screen.
  const touches = new Map();
  let pinchFrom = 0;
  let pinchDistance = 0;
  let lastTapAt = 0;
  let lastTapX = 0;
  let lastTapY = 0;
  let downAt = 0;
  let downX = 0;
  let downY = 0;

  const spread = () => {
    const [a, b] = [...touches.values()];
    return Math.hypot(a.x - b.x, a.y - b.y);
  };

  canvas.addEventListener('pointerdown', (ev) => {
    if (ev.pointerType === 'touch') {
      touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      downAt = performance.now();
      downX = ev.clientX;
      downY = ev.clientY;
      if (touches.size === 2) {
        pinchFrom = spread();
        pinchDistance = cam.distance;
        dragging = false;
        return;
      }
    }
    dragging = true;
    lastX = ev.clientX;
    lastY = ev.clientY;
    cam.lastInput = performance.now();
    cam.tween = null;
    cam.yawVel = 0;
    cam.pitchVel = 0;
    try { canvas.setPointerCapture(ev.pointerId); } catch (err) { /* synthetic or stale pointer */ }
  });
  canvas.addEventListener('pointermove', (ev) => {
    if (ev.pointerType === 'touch' && touches.has(ev.pointerId)) {
      touches.set(ev.pointerId, { x: ev.clientX, y: ev.clientY });
      if (touches.size === 2 && pinchFrom > CONFIG.pinchMinPx) {
        // Same clamp as the wheel, so a phone and a mouse cannot reach
        // different places.
        cam.distance = clamp(pinchDistance * (pinchFrom / Math.max(1, spread())),
          CONFIG.distanceMin, CONFIG.distanceMax);
        cam.lastInput = performance.now();
        return;
      }
    }
    hover.x = ev.clientX;
    hover.y = ev.clientY;
    if (!dragging) return;
    const dx = ev.clientX - lastX;
    const dy = ev.clientY - lastY;
    lastX = ev.clientX;
    lastY = ev.clientY;
    cam.yaw += dx * CONFIG.dragYawPerPx;
    cam.pitch = clamp(cam.pitch + dy * CONFIG.dragPitchPerPx, -pitchLimit, pitchLimit);
    cam.yawVel = dx * CONFIG.dragYawPerPx;
    cam.pitchVel = dy * CONFIG.dragPitchPerPx;
    cam.lastInput = performance.now();
  });
  const release = () => { dragging = false; cam.lastInput = performance.now(); };

  /** A tap does what a hover does on a desktop: it names the thing. */
  canvas.addEventListener('pointerup', (ev) => {
    if (ev.pointerType === 'touch') {
      touches.delete(ev.pointerId);
      if (touches.size < 2) pinchFrom = 0;
      const moved = Math.hypot(ev.clientX - downX, ev.clientY - downY);
      const quick = performance.now() - downAt < 400;
      if (moved <= CONFIG.tapSlopPx && quick) {
        const now = performance.now();
        const near = Math.hypot(ev.clientX - lastTapX, ev.clientY - lastTapY) < 40;
        if (now - lastTapAt < CONFIG.doubleTapMs && near) {
          resetCamera();
          lastTapAt = 0;
        } else {
          lastTapAt = now;
          lastTapX = ev.clientX;
          lastTapY = ev.clientY;
          // hover.key is worked out during the frame from these coordinates,
          // so the tap sets the point and the next frame resolves the node.
          hover.x = ev.clientX;
          hover.y = ev.clientY;
        }
      }
      hideProvenance();
    }
    release(ev);
  });
  canvas.addEventListener('pointercancel', release);
  canvas.addEventListener('pointerleave', () => { hover.x = -1; hover.y = -1; });

  canvas.addEventListener('wheel', (ev) => {
    ev.preventDefault();
    cam.distance = clamp(cam.distance * (1 + ev.deltaY * CONFIG.wheelPerNotch),
      CONFIG.distanceMin, CONFIG.distanceMax);
    cam.lastInput = performance.now();
  }, { passive: false });

  canvas.addEventListener('dblclick', () => resetCamera());

  function resetCamera() {
    // Tweened, never a snap cut. Spec section 4.
    cam.tween = {
      start: performance.now(),
      from: { yaw: cam.yaw, pitch: cam.pitch, distance: cam.distance },
      to: { yaw: Math.round(cam.yaw / (Math.PI * 2)) * Math.PI * 2 + CONFIG.yawStart,
        pitch: rad(CONFIG.elevationDeg), distance: CONFIG.distance },
    };
    cam.yawVel = 0;
    cam.pitchVel = 0;
  }

  const track = dom('scrubTrack');
  let scrubbing = false;
  const seekFromX = (clientX) => {
    const box = track.getBoundingClientRect();
    const k = clamp((clientX - box.left) / box.width, 0, 1);
    state.holdUntil = 0;
    state.fadeFrom = null;
    seek(Brain.start + (Brain.end - Brain.start) * k);
  };
  track.addEventListener('pointerdown', (ev) => {
    scrubbing = true;
    try { track.setPointerCapture(ev.pointerId); } catch (err) { /* synthetic or stale pointer */ }
    seekFromX(ev.clientX);
  });
  track.addEventListener('pointermove', (ev) => { if (scrubbing) seekFromX(ev.clientX); });
  track.addEventListener('pointerup', () => { scrubbing = false; });

  window.addEventListener('keydown', (ev) => {
    if (ev.code === 'Space') { ev.preventDefault(); state.playing = !state.playing; }
    if (ev.key === 'f') CONFIG.showStats = !CONFIG.showStats;
    if (ev.key === 'a') setPanel(!document.body.classList.contains('panel-open'));
    if (ev.key === 'm') musicToggleMute();
  });
  window.addEventListener('resize', () => { resize(); placePanel(); applyPhone(); });

  // The three phone controls. They exist in the markup on every screen and the
  // media query decides whether anyone can see them.
  const mMusic = dom('mMusic');
  const mPanel = dom('mPanel');
  const mTray = dom('mTray');
  if (mMusic) {
    mMusic.addEventListener('click', () => {
      // Joe, 2026-09-24, on his phone: "No audio playing yet." The phone
      // stylesheet hides #music outright, so toggling it showed nothing. With
      // one track the icon IS the control: a tap plays it (inside the gesture,
      // which is what a phone browser needs), a second tap pauses. With several
      // it opens the picker, which the phone stylesheet now allows on .show.
      const pick = dom('musicPick');
      if (music.tracks.length === 1) {
        const playing = music.audio && !music.audio.paused && music.current;
        if (playing) {
          music.audio.pause();
          music.current = '';
          dom('musicMute').classList.remove('playing');
          if (pick) pick.value = '';
        } else {
          if (pick) pick.value = music.tracks[0].file;
          musicPlay(music.tracks[0].file);
        }
        mMusic.classList.toggle('on', !playing);
        return;
      }
      const box = dom('music');
      box.classList.toggle('show');
      mMusic.classList.toggle('on', box.classList.contains('show'));
      if (box.classList.contains('show') && pick && pick.focus) pick.focus();
    });
  }
  if (mPanel) {
    mPanel.addEventListener('click', () => {
      setPanel(!document.body.classList.contains('panel-open'));
      mPanel.classList.toggle('on', document.body.classList.contains('panel-open'));
    });
  }
  if (mTray) mTray.addEventListener('click', () => setPanel(true));

  // Tap outside the sheet dismisses it, and a downward swipe on it does too.
  document.addEventListener('pointerdown', (ev) => {
    if (!isPhone() || !document.body.classList.contains('panel-open')) return;
    const panel = dom('panel');
    const inside = panel && panel.contains && panel.contains(ev.target);
    const onBar = dom('mobileBar') && dom('mobileBar').contains(ev.target);
    if (!inside && !onBar) setPanel(false);
  }, true);

  let sheetFrom = null;
  const panelEl = dom('panel');
  if (panelEl) {
    panelEl.addEventListener('pointerdown', (ev) => { sheetFrom = ev.clientY; });
    panelEl.addEventListener('pointerup', (ev) => {
      if (sheetFrom !== null && ev.clientY - sheetFrom > 60) setPanel(false);
      sheetFrom = null;
    });
  }

  // The badge opens its own provenance, which has nowhere to live on a phone.
  const marker = dom('marker');
  if (marker) {
    marker.addEventListener('click', () => {
      if (!isPhone()) return;
      const box = dom('provenance');
      const text = dom('markerWhere').textContent || dom('markerNow').textContent;
      box.textContent = text;
      box.classList.toggle('hidden', !text || !box.classList.contains('hidden'));
    });
  }
}

/**
 * The demo header, David's layout, 2026-09-24.
 *
 * Full block on load (heading, subhead, paragraph, link), top left beside the
 * gear. After CONFIG.headerHoldMs with no interaction it fades to a compact
 * title that keeps the link, because the link is the one thing a viewer should
 * act on. Hover or "i" brings the full block back for another hold. The drawer
 * opening, or a narrow window, sends it straight to compact.
 */
function buildDemoHeader(h, fallback) {
  const box = dom('caption');
  box.textContent = '';
  box.classList.remove('hidden');
  if (!h) { box.textContent = fallback; return; }
  const title = el('div', 'hTitle', h.title);
  const sub = el('div', 'hSub', h.subhead);
  const body = el('p', 'hBody', h.body);
  const link = el('a', 'hLink', h.linkText);
  link.href = h.linkHref;
  link.target = '_blank';
  link.rel = 'noopener';
  // The intro's four-colour line, kept under the title for the whole demo so
  // the header matches the opening. Joe, 2026-09-25.
  const rule = el('div', 'hRule');
  rule.style.background = 'linear-gradient(90deg, ' + PALETTE.sectionOrder.join(', ') + ')';
  const head = el('div', 'hHead');
  head.append(title, rule);
  box.append(head, sub, body, link);
  box.classList.add('header');

  let timer = 0;
  const narrow = () => window.innerWidth < CONFIG.headerNarrowPx
    || document.body.classList.contains('drawer-open');
  const compact = () => { box.classList.add('compact'); };
  const expand = () => {
    if (narrow()) { compact(); return; }
    box.classList.remove('compact');
    clearTimeout(timer);
    timer = setTimeout(compact, CONFIG.headerHoldMs);
  };
  box.addEventListener('mouseenter', expand);
  window.addEventListener('keydown', (ev) => {
    if (ev.key === 'i' && !ev.ctrlKey && !ev.metaKey && !ev.altKey) expand();
  });
  // A phone has no hover and no "i", so a tap on the title opens the whole
  // block and a tap anywhere else closes it. Found reading the export before
  // publishing, 2026-09-24: without this a phone could never reach the
  // paragraph or the link, because narrow() keeps it compact under 900px.
  box.addEventListener('click', (ev) => {
    if (!isPhone() || !box.classList.contains('compact')) return;
    box.classList.remove('compact');
    ev.stopPropagation();
  });
  document.addEventListener('pointerdown', (ev) => {
    if (isPhone() && !box.classList.contains('compact') && !box.contains(ev.target)) compact();
  }, true);
  window.addEventListener('resize', () => { if (narrow()) compact(); });
  state.headerExpand = expand;
  new MutationObserver(() => { if (narrow()) compact(); })
    .observe(document.body, { attributes: true, attributeFilter: ['class'] });
  expand();
}

// ------------------------------------------------------------------ intro
