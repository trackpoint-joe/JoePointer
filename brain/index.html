// The demo's opening, David 2026-09-25. It moves the camera and nothing else:
// no seat lights, nothing travels along an edge, and the replay stays on frame
// one until the header has landed. Stars are dust and faint, never the pulse
// colour, so none of it can be read as an event.

const intro = {
  phase: null, t0: 0, from: 0, to: 0, timer: 0, sound: false,
  labelK: 1, stars: [], nebulae: [], fadeAt: 0, prevDist: 0, flightMs: 0, readAt: 0,
};

function introSeen() {
  try { return sessionStorage.getItem('brain.introSeen') === '1'; } catch (err) { return false; }
}

function introMarkSeen() {
  try { sessionStorage.setItem('brain.introSeen', '1'); } catch (err) { /* fine */ }
}

const reducedMotion = () => Boolean(window.matchMedia
  && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

function buildIntroStars() {
  intro.stars = [];
  for (let i = 0; i < CONFIG.introStarCount; i += 1) {
    // a is the distance from the brain toward the start of the flight. Stars
    // ahead of the arrival point stream past; the ones behind the brain stay
    // as its backdrop, spread wider so they reach the edges of the screen.
    const a = lerp(-25, CONFIG.introFromDistance + 5, Math.random());
    const th = Math.random() * Math.PI * 2;
    const spread = 1 + Math.max(0, 3 - a) / 4;
    const r = (0.9 + Math.pow(Math.random(), 0.6) * 9) * spread;
    const roll = Math.random();
    intro.stars.push({
      a, x: r * Math.cos(th), y: r * Math.sin(th),
      sz: 0.6 + Math.random() * 1.4,
      al: 0.15 + Math.random() * 0.45,
      // Never PALETTE.accent: it is the pulse colour, and a star that looks
      // like a pulse is a fake event. Section colours are structure, not work.
      color: roll < 0.16 ? PALETTE.sectionOrder[i % 4] : roll < 0.6 ? PALETTE.dust : PALETTE.faint,
    });
  }
  // Nebulae: large soft glows in the four section colours. Some sit along the
  // flight and are passed through; the rest stay behind the brain as its
  // backdrop while the paragraph is read. Joe, 2026-09-25: "more color".
  intro.nebulae = [];
  for (let i = 0; i < CONFIG.introNebulae; i += 1) {
    const behind = i < CONFIG.introNebulae / 2;
    const a = behind ? lerp(-18, -6, Math.random()) : lerp(8, CONFIG.introFromDistance - 5, Math.random());
    const th = (i / CONFIG.introNebulae) * Math.PI * 2 + Math.random() * 0.8;
    const r = behind ? lerp(5, 10, Math.random()) : lerp(2, 6, Math.random());
    intro.nebulae.push({
      a, x: r * Math.cos(th), y: r * Math.sin(th) * 0.7,
      R: behind ? lerp(5, 8, Math.random()) : lerp(2.5, 4.5, Math.random()),
      color: PALETTE.sectionOrder[i % 4],
      al: behind ? lerp(0.24, 0.34, Math.random()) : lerp(0.12, 0.18, Math.random()),
      ph: Math.random() * Math.PI * 2,
    });
  }
}

function drawIntroNebulae(now, k) {
  for (const n of intro.nebulae || []) {
    const z = cam.distance - n.a;
    if (z < 0.5) continue;
    const drift = 0.4 * Math.sin(now / 17000 + n.ph);
    const p = project({ x: n.x + drift, y: n.y + drift * 0.5, z });
    if (!p) continue;
    const rPx = Math.min(n.R * p.scale, Math.max(view.w, view.h) * 1.5);
    // Fade as the camera passes through, so a cloud never fills the screen.
    const alpha = n.al * k * clamp((z - 0.5) / 4, 0, 1);
    if (alpha <= 0.005 || rPx < 1) continue;
    const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, rPx);
    g.addColorStop(0, hexAlpha(n.color, alpha));
    g.addColorStop(0.45, hexAlpha(n.color, alpha * 0.45));
    g.addColorStop(1, hexAlpha(n.color, 0));
    ctx.fillStyle = g;
    ctx.fillRect(p.x - rPx, p.y - rPx, rPx * 2, rPx * 2);
  }
}

function drawIntroStars(now) {
  if (!intro.stars.length) return;
  let k = intro.phase === 'title' ? clamp((now - intro.t0) / 800, 0, 1) : 1;
  if (intro.fadeAt) {
    k = 1 - (now - intro.fadeAt) / CONFIG.introStarFadeMs;
    if (k <= 0) { intro.stars = []; intro.fadeAt = 0; return; }
  }
  const dz = intro.prevDist ? intro.prevDist - cam.distance : 0;
  ctx.globalCompositeOperation = 'lighter';
  drawIntroNebulae(now, k);
  ctx.globalAlpha = 1;
  for (const s of intro.stars) {
    const z = cam.distance - s.a;
    if (z < 0.2) continue;
    const p = project({ x: s.x, y: s.y, z });
    if (!p) continue;
    ctx.globalAlpha = s.al * k * clamp(z / 1.5, 0, 1);
    if (dz > 0.002) {
      // A streak back along the line of flight, as long as the frame's travel.
      const q = project({ x: s.x, y: s.y, z: z + dz * 4 });
      if (!q) continue;
      ctx.strokeStyle = s.color;
      ctx.lineWidth = s.sz;
      ctx.beginPath();
      ctx.moveTo(q.x, q.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    } else {
      ctx.fillStyle = s.color;
      ctx.fillRect(p.x - s.sz / 2, p.y - s.sz / 2, s.sz, s.sz);
    }
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';
}

/** Owns the camera while the intro runs. False when there is no intro. */
function stepIntro(now) {
  if (!intro.phase) { intro.prevDist = 0; return false; }
  // Still for the title and the flight. From the paragraph on it turns at the
  // normal rotation speed, so the replay picks up the same motion unbroken.
  const turning = intro.phase === 'read' || intro.phase === 'settle';
  const perTurn = CONFIG.autoRotate === false ? 0 : CONFIG.autoRotateSecPerTurn;
  cam.yaw = CONFIG.yawStart + (turning && perTurn
    ? ((now - intro.readAt) / 1000) * ((Math.PI * 2) / perTurn) : 0);
  cam.pitch = rad(CONFIG.elevationDeg);
  cam.yawVel = 0;
  cam.pitchVel = 0;
  cam.tween = null;
  intro.prevDist = cam.distance;
  if (intro.phase === 'title') {
    cam.distance = intro.from;
    intro.labelK = 0;
  } else if (intro.phase === 'flight') {
    const k = clamp((now - intro.t0) / intro.flightMs, 0, 1);
    const e = easeInOut(k);
    // In log space, so the brain grows at an even rate on screen. Linear in
    // distance would leave it a dot for four seconds and then leap.
    cam.distance = Math.exp(lerp(Math.log(intro.from), Math.log(intro.to), e));
    intro.labelK = clamp((e - CONFIG.introLabelFromK) / (1 - CONFIG.introLabelFromK), 0, 1);
    if (k >= 1) introRead();
  } else {
    cam.distance = intro.to;
    // Names dimmed under the paragraph so they never show through the text,
    // back to full as it settles into the header.
    intro.labelK = intro.phase === 'read' ? 0.25 : 1;
  }
  return true;
}

function introDom() {
  let box = dom('intro');
  if (box) return box;
  const h = Brain.LABELS.demoHeader;
  box = el('div', '');
  box.id = 'intro';
  const coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
  const titleCard = el('div', 'iTitleCard');
  const go = el('button', 'iGo', coarse ? 'Tap to begin' : 'Click to begin');
  go.type = 'button';
  const rule = el('div', 'iRule');
  rule.style.background = 'linear-gradient(90deg, ' + PALETTE.sectionOrder.join(', ') + ')';
  titleCard.append(el('div', 'iTitle', h.title), rule, el('div', 'iSub', h.subhead), go);
  const card = el('div', 'iCard');
  card.id = 'introCard';
  // The title again, smaller, so the paragraph has a head and the card
  // shrinks title into title when it settles into the header.
  const cardRule = el('div', 'iRule iCardRule');
  cardRule.style.background = rule.style.background;
  card.append(el('div', 'iCardTitle', h.title), cardRule, introBody(h.body),
    el('div', 'iHint', coarse ? 'Tap to continue' : 'Click to continue'));
  box.append(titleCard, card);
  box.addEventListener('click', (ev) => { ev.stopPropagation(); introAdvance(true); });
  document.body.appendChild(box);
  // Keys advance the intro and reach nothing else while it runs, so space
  // cannot pause a replay that has not started.
  window.addEventListener('keydown', (ev) => {
    if (!intro.phase || ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (['Shift', 'Control', 'Alt', 'Meta', 'Tab'].includes(ev.key)) return;
    ev.stopImmediatePropagation();
    ev.preventDefault();
    introAdvance(true);
  }, true);
  return box;
}

/** The paragraph, with the two gates and Joe's line in their node colours. */
function introBody(text) {
  const p = el('p', 'iBody');
  const marks = [
    ['Marcus', PALETTE.gates.marcus],
    ['AI-Joe', PALETTE.gates['ai-joe']],
    ['Then I make the call.', PALETTE.joe],
  ];
  let rest = text;
  for (;;) {
    let best = null;
    for (const [word, color] of marks) {
      const at = rest.indexOf(word);
      if (at >= 0 && (!best || at < best.at)) best = { at, word, color };
    }
    if (!best) { p.appendChild(document.createTextNode(rest)); break; }
    p.appendChild(document.createTextNode(rest.slice(0, best.at)));
    const span = el('span', 'iMark', best.word);
    span.style.color = best.color;
    p.appendChild(span);
    rest = rest.slice(best.at + best.word.length);
  }
  return p;
}

function introBegin() {
  const box = introDom();
  clearTimeout(intro.timer);
  intro.from = CONFIG.introFromDistance;
  intro.to = isPhone() ? CONFIG.phoneDistance : CONFIG.distance;
  intro.sound = false;
  intro.fadeAt = 0;
  buildIntroStars();
  intro.phase = 'title';
  intro.t0 = performance.now();
  intro.labelK = 0;
  box.className = 'title';
  box.style.display = '';
  const card = dom('introCard');
  card.style.transition = '';
  card.style.transform = '';
  card.style.opacity = '';
  document.body.classList.remove('intro-out');
  document.body.classList.add('intro');
  intro.timer = setTimeout(() => introAdvance(false), CONFIG.introAutoBeginMs);
}

function introAdvance(gesture) {
  if (!intro.phase) return;
  clearTimeout(intro.timer);
  if (gesture && !intro.sound && (intro.phase === 'title' || intro.phase === 'flight')) introSound();
  if (intro.phase === 'title') {
    if (reducedMotion()) { introRead(); return; }
    intro.phase = 'flight';
    intro.t0 = performance.now();
    intro.flightMs = intro.sound && CONFIG.introHitSec ? CONFIG.introHitSec * 1000 : CONFIG.introFlightMs;
    dom('intro').className = 'flight';
  } else if (intro.phase === 'flight') {
    introRead();
  } else if (intro.phase === 'read') {
    introSettle();
  }
}

function introRead() {
  intro.phase = 'read';
  intro.t0 = performance.now();
  intro.readAt = intro.t0;
  intro.labelK = 0.25;
  cam.distance = intro.to;
  dom('intro').className = 'read';
  clearTimeout(intro.timer);
  intro.timer = setTimeout(() => introAdvance(false), CONFIG.introReadMs);
}

/** The paragraph shrinks into the corner header, then the replay starts. */
function introSettle() {
  intro.phase = 'settle';
  const box = dom('intro');
  const card = dom('introCard');
  const cap = dom('caption');
  box.className = 'settle';
  document.body.classList.remove('intro');
  document.body.classList.add('intro-out');
  if (state.headerExpand) state.headerExpand();
  const from = card.getBoundingClientRect();
  const to = cap.getBoundingClientRect();
  card.style.transition = 'transform ' + CONFIG.introSettleMs + 'ms ease-in-out, opacity '
    + CONFIG.introSettleMs + 'ms ease-in';
  if (to.width && from.width) {
    card.style.transformOrigin = '0 0';
    card.style.transform = 'translate(' + (to.left - from.left) + 'px, ' + (to.top - from.top)
      + 'px) scale(' + (to.width / from.width) + ')';
  }
  card.style.opacity = '0';
  intro.fadeAt = performance.now();
  if (intro.sound) introHandOff();
  clearTimeout(intro.timer);
  intro.timer = setTimeout(() => {
    intro.phase = null;
    box.style.display = 'none';
    document.body.classList.remove('intro-out');
    // As if the viewer let go long ago, so auto-rotate carries on at full
    // speed rather than pausing and easing back in.
    cam.lastInput = performance.now() - CONFIG.autoRotateResumeMs - CONFIG.autoRotateEaseMs;
    introMarkSeen();
  }, CONFIG.introSettleMs);
}

function introSound() {
  if (!music.intro) return;
  if (!music.audio) {
    music.audio = new Audio();
    music.audio.addEventListener('ended', () => musicAdvance());
  }
  music.audio.loop = false;
  music.audio.src = music.intro.url;
  music.audio.volume = 0;
  music.audio.muted = music.muted;
  const started = music.audio.play();
  if (started && started.catch) started.catch(() => {});
  musicFade(CONFIG.musicVolume);
  intro.sound = true;
}

/** Intro music out, the demo track in. Only after a real gesture started it. */
function introHandOff() {
  const remembered = musicRecall();
  const next = music.tracks.some((t) => t.file === remembered) ? remembered
    : (music.tracks[0] && music.tracks[0].file);
  if (!next) {
    musicFade(0, () => { if (music.audio) music.audio.pause(); }, CONFIG.introCrossfadeMs);
    return;
  }
  musicFade(0, () => {
    const pick = dom('musicPick');
    if (pick) pick.value = next;
    musicPlay(next);
  }, CONFIG.introCrossfadeMs);
}

/** Settings, "Play again": back to frame one and the title. */
function replayIntro() {
  if (!state.headerExpand || !Brain.session) return;
  if (music.audio && !music.audio.paused) musicFade(0, () => music.audio.pause());
  seek(Brain.start);
  state.holdUntil = 0;
  introBegin();
}

function stepCamera(dtMs, now) {
  if (cam.tween) {
    const k = clamp((now - cam.tween.start) / CONFIG.resetTweenMs, 0, 1);
    const e = easeInOut(k);
    cam.yaw = lerp(cam.tween.from.yaw, cam.tween.to.yaw, e);
    cam.pitch = lerp(cam.tween.from.pitch, cam.tween.to.pitch, e);
    cam.distance = lerp(cam.tween.from.distance, cam.tween.to.distance, e);
    if (k >= 1) { cam.tween = null; cam.lastInput = now; }
    return;
  }
  const pitchLimit = rad(CONFIG.pitchClampDeg);
  if (Math.abs(cam.yawVel) > CONFIG.inertiaCutoff || Math.abs(cam.pitchVel) > CONFIG.inertiaCutoff) {
    cam.yaw += cam.yawVel * (dtMs / 16);
    cam.pitch = clamp(cam.pitch + cam.pitchVel * (dtMs / 16), -pitchLimit, pitchLimit);
    const damp = Math.pow(CONFIG.inertiaDamping, dtMs / 16);
    cam.yawVel *= damp;
    cam.pitchVel *= damp;
    return;
  }
  // Constant speed, always. It never quickens when more is happening, which is
  // Bea's rule that brightness is not value, carried over into motion.
  if (CONFIG.autoRotate === false) return;
  const idle = now - cam.lastInput - CONFIG.autoRotateResumeMs;
  if (idle <= 0) return;
  const ease = clamp(idle / CONFIG.autoRotateEaseMs, 0, 1);
  cam.yaw += ((Math.PI * 2) / CONFIG.autoRotateSecPerTurn) * (dtMs / 1000) * easeInOut(ease);
}

// ------------------------------------------------------------------- loop

const stats = { frames: 0, total: 0, worst: 0, last: 0, avg: 0 };
let lastFrame = 0;
let running = true;

/** Freeze, then cross fade back to frame one. Never a cut. Spec section 5. */
function startCrossfade(now) {
  const shot = document.createElement('canvas');
  shot.width = canvas.width;
  shot.height = canvas.height;
  shot.getContext('2d').drawImage(canvas, 0, 0);
  state.fadeFrom = shot;
  state.fadeStart = now;
  seek(Brain.start);
}

function frame(now) {
  if (!running) return;
  const t0 = performance.now();
  const dtMs = lastFrame ? Math.min(now - lastFrame, 250) : 16;
  lastFrame = now;

  // Live never runs the replay clock. The scene is whatever has landed.
  // The intro holds the replay on frame one. Marcus: the clock does not start
  // until the header has landed.
  if (state.mode !== 'LIVE' && state.playing && Brain.events.length && !intro.phase) {
    if (state.holdUntil) {
      if (now >= state.holdUntil) { state.holdUntil = 0; startCrossfade(now); }
    } else {
      const next = Brain.events[state.cursor];
      let t;
      if (CONFIG.demoPacing && next) {
        // Each real gap is played back in a window between the min and the
        // max, so the rate changes per gap and nobody waits. Never overshoot
        // the next event, so each one gets its own frame.
        const prevTs = state.cursor > 0 ? Brain.events[state.cursor - 1].ts_ms : Brain.start;
        const realGap = Math.max(1, next.ts_ms - prevTs);
        const shown = clamp(realGap / CONFIG.playbackSpeed, CONFIG.demoMinGapMs, CONFIG.demoMaxGapMs);
        t = Math.min(next.ts_ms, state.t + dtMs * (realGap / shown));
      } else {
        let dt = dtMs * CONFIG.playbackSpeed;
        // Silence longer than the cap runs at speed. Anything tighter plays at
        // its real spacing, which is what keeps the rhythm honest.
        if (next && next.ts_ms - state.t > CONFIG.gapCapMs) dt *= CONFIG.silenceSpeed;
        t = state.t + dt;
      }
      t = Math.min(Brain.end, t);
      advanceTo(t, true);
      if (t >= Brain.end) state.holdUntil = now + CONFIG.endHoldMs;
    }
  }

  if (!stepIntro(now)) stepCamera(dtMs, now);
  stepView();
  const at = currentAt();
  syncChips(at);
  drawFrame(at, now);

  if (state.fadeFrom) {
    const k = (now - state.fadeStart) / CONFIG.crossfadeMs;
    if (k >= 1) {
      state.fadeFrom = null;
    } else {
      ctx.save();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = 'source-over';
      ctx.globalAlpha = 1 - k;
      ctx.drawImage(state.fadeFrom, 0, 0);
      ctx.restore();
      ctx.globalAlpha = 1;
    }
  }

  paintOverlays(now);

  const spent = performance.now() - t0;
  stats.frames += 1;
  stats.total += spent;
  stats.last = spent;
  stats.avg = stats.total / stats.frames;
  if (spent > stats.worst) stats.worst = spent;
  if (CONFIG.showStats) {
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;
    ctx.fillStyle = PALETTE.muted;
    ctx.font = '12px ui-monospace, Consolas, monospace';
    ctx.textAlign = 'left';
    ctx.fillText(
      `frame ${spent.toFixed(2)}ms  avg ${stats.avg.toFixed(2)}ms  worst ${stats.worst.toFixed(2)}ms  nodes ${scene.nodes.size}`,
      16, view.h - 96,
    );
  }
  requestAnimationFrame(frame);
}

// ------------------------------------------------------------------ start

/** The overlays read the palette, so colour has one home and cannot drift. */
function applyPaletteToCss() {
  const map = {
    '--bg': PALETTE.bg,
    '--panel': PALETTE.panel,
    '--border': PALETTE.border,
    '--text': PALETTE.label,
    '--muted': PALETTE.muted,
    '--faint': PALETTE.faint,
    '--accent': PALETTE.accent,
    '--gate': PALETTE.gates['ai-joe'],
  };
  for (const k in map) document.documentElement.style.setProperty(k, map[k]);
}

(async function start() {
  applyPaletteToCss();
  canvas = dom('stage');
  ctx = canvas.getContext('2d');
  resize();

  try {
    await Brain.load();
  } catch (err) {
    dom('banner').classList.remove('hidden');
    dom('banner').textContent = 'The brain server did not answer: ' + err.message;
    return;
  }

  if (Brain.source === 'demo') {
    state.mode = 'DEMO';
    document.body.classList.add('demo');
    // The caption, Joe's words as of 2026-09-24, in js/data.js BRAIN_LABELS.
    //
    // It is withheld unless the pack is what the caption says it is. The line
    // reads "replaying one real session", and this pack is generated, so
    // showing it would put a false claim on the screen in Joe's voice. The
    // check is on the pack's own meta.origin, not on a flag anyone sets by
    // hand. Marcus and AI-Joe, 2026-09-24.
    const caption = Brain.LABELS.demoCaption;
    const needs = Brain.LABELS.demoCaptionRequiresOrigin;
    const origin = (Brain.meta || {}).origin;
    if (caption && (!needs || origin === needs)) {
      buildDemoHeader(Brain.LABELS.demoHeader, caption);
    } else if (caption) {
      console.log('brain: caption withheld, it describes a ' + needs +
        ' pack and this one is ' + (origin || 'unstated'));
    }
  }

  if (Brain.source === 'fixture') {
    dom('banner').classList.remove('hidden');
    dom('banner').innerHTML = 'FIXTURE. Nothing here is a real session.' +
      '<small>Generated by tools/make_fixture.py through the real hook. ' +
      (Brain.sourceDir || 'BRAIN_DIR is set') + '</small>';
  }

  buildScene();
  buildAmbient();
  wireInput();
  initPanel();
  applyPhone();
  window.Settings.init(CONFIG, PALETTE);
  await window.Settings.loadConfig();
  window.Settings.wire();
  window.Settings.build();
  setInterval(musicQuietCheck, 60000);
  initMusic();
  resize();

  if (!Brain.session) {
    dom('markerText').textContent = 'WAITING';
    dom('markerClock').textContent = '--:--:--';
    panelNote('No session qualifies for replay. A seat has to have started and stopped in it.');
  } else {
    seek(Brain.start);
    if (state.mode === 'DEMO' && state.headerExpand && !introSeen()) introBegin();
  }

  document.addEventListener('visibilitychange', () => {
    // A hidden tab holds the replay where it is rather than racing forward on
    // wake, and stops burning a core on a screen nobody is looking at.
    if (document.hidden) {
      running = false;
    } else if (!running) {
      running = true;
      lastFrame = 0;
      requestAnimationFrame(frame);
    }
  });

  // Start watching the tail. With no cursor the server hands back where
  // today's file ends right now and no events, so the page never replays the
  // part of the day it missed just because it opened.
  //
  // A demo never does this. It has no server to ask, it must work from file://
  // with the network off, and a demo that could flip to LIVE would be showing
  // a stranger Joe's machine. One branch, taken once, at startup.
  if (state.mode !== 'DEMO') {
    try {
      const head = await Brain.tail();
      live.cursor = head.cursor;
    } catch (err) {
      live.cursor = null;   // an older server without the route: live never starts
    }
    startPolling();
  }

  requestAnimationFrame(frame);
  window.Brain3D = { CONFIG, PALETTE, LAYOUT, cam, state, scene, stats, live, music, pollTail, seek,
    intro, replayIntro, introAvailable: Boolean(state.headerExpand && Brain.session) };
})();

</script>
</body>
